                    });
                }

                // --------- Mount / refresh ---------
                async function refreshContent() {
                    const box = $('#peony-content');
                    if (!box) return;
                    box.innerHTML = loadingBox();
                    try {
                        if (s.tab === 'prices') {
                            const d = await loadMaterials();
                            box.innerHTML = renderMaterialsList(d);
                            bindMaterialHandlers();
                        } else if (s.tab === 'trends') {
                            const d = await loadTrends();
                            box.innerHTML = renderTrends(d);
                            document.querySelectorAll('[data-material]').forEach(btn => {
                                btn.addEventListener('click', () => openMaterialModal(btn.dataset.material));
                            });
                        } else if (s.tab === 'files') {
                            const d = await loadFiles();
                            box.innerHTML = renderFiles(d);
                            bindFileHandlers();
                        }
                    } catch (e) {
                        box.innerHTML = errorBox(e.message || String(e));
                    }
                }
                function bindMaterialHandlers() {
                    document.querySelectorAll('[data-material]').forEach(btn => {
                        btn.addEventListener('click', () => openMaterialModal(btn.dataset.material));
                    });
                    document.querySelectorAll('[data-msort]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            s.matSort = btn.dataset.msort;
                            s.offset = 0;
                            refreshContent();
                        });
                    });
                    $('#peony-prev')?.addEventListener('click', () => { s.offset = Math.max(0, s.offset - s.limit); refreshContent(); });
                    $('#peony-next')?.addEventListener('click', () => { s.offset += s.limit; refreshContent(); });
                }
                function bindPagerHandlers() {
                    $('#peony-prev')?.addEventListener('click', () => { s.offset = Math.max(0, s.offset - s.limit); refreshContent(); });
                    $('#peony-next')?.addEventListener('click', () => { s.offset += s.limit; refreshContent(); });
                }
                // --------- Modal de importación de archivos PeonyInc ---------
                function closeImportModal() { document.getElementById('peony-import-modal')?.remove(); }

                function showImportError({ title, message, detail, canRetry = true }) {
                    const modal = document.getElementById('peony-import-modal');
                    if (!modal) return;
                    modal.querySelector('div').innerHTML = `
                        <div class="p-6 space-y-4">
                            <div class="flex items-start gap-3">
                                <div class="text-3xl shrink-0">⚠</div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-red-900">${esc(title)}</div>
                                    <div class="text-sm text-text-light mt-1 whitespace-pre-line break-words">${esc(message)}</div>
                                    ${detail ? `<div class="text-[10px] font-mono text-text-muted mt-2 bg-warm-gray/60 p-2 rounded break-all">${esc(detail)}</div>` : ''}
                                </div>
                            </div>
                            <div class="flex gap-2">
                                ${canRetry ? `<button id="peony-import-retry" class="flex-1 px-4 py-2 rounded-xl text-sm bg-brand text-white font-semibold hover:bg-brand-dark">Reintentar</button>` : ''}
                                <button id="peony-import-close" class="flex-1 px-4 py-2 rounded-xl text-sm bg-white border border-warm-gray-dark/50 hover:bg-warm-gray">Cerrar</button>
                            </div>
                        </div>`;
                    modal.querySelector('#peony-import-close').addEventListener('click', closeImportModal);
                    modal.querySelector('#peony-import-retry')?.addEventListener('click', () => {
                        closeImportModal();
                        openImportModal();
                    });
                }

                async function openImportModal() {
                    closeImportModal();
                    const modal = document.createElement('div');
                    modal.id = 'peony-import-modal';
                    modal.className = 'fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm';
                    modal.addEventListener('click', e => { if (e.target === modal) closeImportModal(); });
                    modal.innerHTML = `
                        <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-2xl max-h-[92vh] flex flex-col">
                            <div class="p-8 text-center">
                                <div class="inline-block w-10 h-10 border-4 border-warm-gray-dark border-t-accent rounded-full animate-spin"></div>
                                <div class="mt-3 font-semibold">Escaneando maildir…</div>
                                <div class="text-xs text-text-muted">Buscando emails de PeonyInc en el servidor.</div>
                            </div>
                        </div>`;
                    document.body.appendChild(modal);

                    // --- Paso 0: pre-check de conectividad básica (/api.php?action=health) ---
                    let healthReachable = false;
                    let healthErrMsg = '';
                    try {
                        const h = await jsonGet(`${API}?action=health`);
                        healthReachable = !!(h?.ok);
                    } catch (e) {
                        healthErrMsg = String(e?.message || e || '');
                    }

                    if (!healthReachable) {
                        const onFile = location.protocol === 'file:';
                        const isFetchFail = healthErrMsg === 'Failed to fetch' || /NetworkError|network/i.test(healthErrMsg);
                        let msg;
                        if (onFile) {
                            msg = 'La app está abierta con file:// y no tiene servidor PHP corriendo. Abre la URL vía HTTP/HTTPS (ej: https://valkamsync.nautiservint.com/).';
                        } else if (isFetchFail) {
                            msg = 'No se pudo conectar con api.php. Verifica:\n• api.php existe en la raíz del deploy (prueba /api.php?action=health en una pestaña nueva).\n• PHP ≥ 8.1 está habilitado en el hosting.\n• El .htaccess no bloquea peticiones a .php.';
                        } else {
                            msg = `api.php respondió con un error: ${healthErrMsg}. Revisa el error log del hosting.`;
                        }
                        showImportError({
                            title: 'Backend inalcanzable',
                            message: msg,
                            detail: `${API}?action=health  →  ${healthErrMsg || 'no OK'}`,
                        });
                        return;
                    }

                    // --- Paso 1: endpoint específico ---
                    try {
                        const r = await jsonGet(`${API}?action=peony_available_files`);
                        if (!r?.ok) {
                            if (r?.error === 'unknown_action') {
                                showImportError({
                                    title: 'Backend desactualizado',
                                    message: 'Tu api.php no tiene la acción "peony_available_files". Sube la versión más reciente de api.php y lib/peony_repo.php al hosting.',
                                    detail: JSON.stringify(r),
                                });
                            } else {
                                showImportError({
                                    title: 'No se pudo listar archivos',
                                    message: r?.hint || r?.error || 'El servidor respondió pero no pudo completar la operación.',
                                    detail: r?.error ? `error: ${r.error}` : null,
                                });
                            }
                            return;
                        }
                        renderImportList(r.files || []);
                    } catch (e) {
                        const m = String(e?.message || e || '');
                        const is500 = /^HTTP 5\d\d$/.test(m);
                        showImportError({
                            title: is500 ? 'Error interno del servidor' : 'Error en la respuesta',
                            message: is500
                                ? `api.php crasheó con ${m}. Revisa el error log de PHP del hosting. Posibles causas:\n• Falta alguna extensión (pdo_sqlite, mbstring, fileinfo).\n• Permisos de /data/ (SQLite necesita escribir ahí).\n• Fatal error en lib/peony_repo.php.`
                                : `La respuesta no pudo procesarse: ${m}`,
                            detail: `${API}?action=peony_available_files  →  ${m}`,
                        });
                    }
                }

                function renderImportList(files) {
                    const modal = document.getElementById('peony-import-modal');
                    if (!modal) return;
                    // Estado inicial: auto-seleccionar sólo los NO importados
                    const selected = new Set();
                    for (const f of files) if (!f.already_imported) selected.add(f.filename);

                    function redraw() {
                        const total      = files.length;
                        const pending    = files.filter(f => !f.already_imported).length;
                        const overwrites = files.filter(f => f.already_imported && selected.has(f.filename)).length;
                        const warning = overwrites > 0 ? `
                            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-900 mb-3 flex gap-2">
                                <span class="text-lg shrink-0">⚠</span>
                                <div>
                                    Estás por re-importar <strong>${overwrites}</strong> archivo(s) ya importado(s).
                                    Los registros existentes se <strong>sobreescribirán</strong> (se borran y se vuelven a insertar desde el PDF).
                                </div>
                            </div>` : '';

                        modal.querySelector('div').innerHTML = `
                            <div class="p-4 border-b border-warm-gray-dark/30 flex items-start gap-3">
                                <div class="flex-1">
                                    <div class="font-bold text-brand-dark">Importar archivos PeonyInc</div>
                                    <div class="text-xs text-text-muted mt-0.5">${total} archivo(s) · ${pending} pendiente(s) · ${selected.size} seleccionado(s)</div>
                                </div>
                                <button id="peony-import-close" class="w-9 h-9 rounded-full bg-warm-gray hover:bg-warm-gray-dark/60 flex items-center justify-center">✕</button>
                            </div>
                            <div class="p-4 overflow-y-auto flex-1">
                                ${warning}
                                <div class="flex gap-2 mb-3 flex-wrap text-xs">
                                    <button id="peony-sel-none" class="px-2.5 py-1 rounded-lg bg-white border border-warm-gray-dark/50">Ninguno</button>
                                    <button id="peony-sel-all" class="px-2.5 py-1 rounded-lg bg-white border border-warm-gray-dark/50">Todos</button>
                                    <button id="peony-sel-pending" class="px-2.5 py-1 rounded-lg bg-white border border-warm-gray-dark/50">Sólo pendientes</button>
                                </div>
                                <div class="border border-warm-gray-dark/30 rounded-xl divide-y divide-warm-gray-dark/20">
                                    ${files.length === 0 ? '<div class="p-6 text-center text-sm text-text-muted">No se encontraron emails de PeonyInc en el maildir.</div>' : files.map((f, i) => {
                                        const isChecked = selected.has(f.filename);
                                        const tag = f.already_imported
                                            ? `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">✓ importado · ${f.imported_rows} filas</span>`
                                            : `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-blue-50 text-blue-800 border border-blue-200">nuevo</span>`;
                                        return `
                                        <label class="flex items-center gap-3 p-3 hover:bg-warm-gray/30 cursor-pointer ${isChecked ? 'bg-brand/5' : ''}">
                                            <input type="checkbox" data-idx="${i}" ${isChecked ? 'checked' : ''} class="w-5 h-5 accent-brand shrink-0"/>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="font-mono text-sm font-semibold truncate">${esc(f.filename)}</span>
                                                    ${tag}
                                                </div>
                                                <div class="text-[11px] text-text-muted mt-0.5">
                                                    ${esc(f.file_date || '?')} · ${Math.round((f.size||0)/1024)} KB
                                                </div>
                                            </div>
                                        </label>`;
                                    }).join('')}
                                </div>
                            </div>
                            <div class="p-4 border-t border-warm-gray-dark/30 bg-warm-gray/20 flex gap-2">
                                <button id="peony-import-cancel" class="flex-1 px-4 py-2 rounded-xl text-sm bg-white border border-warm-gray-dark/50 hover:bg-warm-gray">Cancelar</button>
                                <button id="peony-import-go" ${selected.size === 0 ? 'disabled' : ''} class="flex-1 px-4 py-2 rounded-xl text-sm bg-brand text-white font-semibold hover:bg-brand-dark disabled:opacity-40">
                                    Importar ${selected.size} ${overwrites > 0 ? '(' + overwrites + ' sobreescrib.)' : ''}
                                </button>
                            </div>`;

                        modal.querySelector('#peony-import-close').addEventListener('click', closeImportModal);
                        modal.querySelector('#peony-import-cancel').addEventListener('click', closeImportModal);
                        modal.querySelector('#peony-sel-none').addEventListener('click', () => { selected.clear(); redraw(); });
                        modal.querySelector('#peony-sel-all').addEventListener('click', () => { selected.clear(); files.forEach(f => selected.add(f.filename)); redraw(); });
                        modal.querySelector('#peony-sel-pending').addEventListener('click', () => {
                            selected.clear();
                            files.forEach(f => { if (!f.already_imported) selected.add(f.filename); });
                            redraw();
                        });
                        modal.querySelectorAll('[data-idx]').forEach(cb => {
                            cb.addEventListener('change', () => {
                                const i = Number(cb.dataset.idx);
                                const fn = files[i].filename;
                                if (cb.checked) selected.add(fn); else selected.delete(fn);
                                redraw();
                            });
                        });
                        modal.querySelector('#peony-import-go')?.addEventListener('click', () => runImport([...selected]));
                    }

                    redraw();
                }

                async function runImport(filenames) {
                    const modal = document.getElementById('peony-import-modal');
                    if (!modal) return;
                    modal.querySelector('div').innerHTML = `
                        <div class="p-8 text-center space-y-3">
                            <div class="inline-block w-10 h-10 border-4 border-warm-gray-dark border-t-brand rounded-full animate-spin"></div>
                            <div class="font-semibold">Importando ${filenames.length} archivo(s)…</div>
                            <div class="text-xs text-text-muted">Parseando PDFs. Puede tardar 30-90 segundos.</div>
                        </div>`;
                    try {
                        const r = await jsonPost(`${API}?action=peony_import_files`, { filenames });
                        if (!r?.ok) throw new Error(r?.error || 'import_failed');
                        const okCount = r.results.filter(x => x.ok).length;
                        const failCount = r.results.length - okCount;
                        modal.querySelector('div').innerHTML = `
                            <div class="p-6 space-y-3">
                                <div class="text-center">
                                    <div class="text-4xl">${failCount === 0 ? '✓' : '⚠'}</div>
                                    <div class="font-bold text-lg ${failCount === 0 ? 'text-emerald-900' : 'text-amber-900'} mt-2">${failCount === 0 ? 'Importación completa' : 'Importación parcial'}</div>
                                    <div class="text-sm text-text-light mt-1">${okCount} archivo(s) · ${r.total_rows} filas insertadas${failCount > 0 ? ' · ' + failCount + ' fallaron' : ''}</div>
                                </div>
                                <div class="max-h-60 overflow-y-auto text-xs space-y-1 border border-warm-gray-dark/30 rounded-lg p-2 bg-warm-gray/30">
                                    ${r.results.map(x => `
                                        <div class="${x.ok ? 'text-emerald-800' : 'text-red-800'} py-0.5">
                                            ${x.ok ? '✓' : '✗'} <span class="font-mono">${esc(x.filename)}</span>${x.ok ? ' · ' + x.rows + ' filas' + (x.replaced ? ' (sobreescrito)' : '') : ' · ' + esc(x.error || '')}
                                        </div>
                                    `).join('')}
                                </div>
                                <button id="peony-import-done" class="w-full px-4 py-2 rounded-xl bg-brand text-white font-semibold">Listo</button>
                            </div>`;
                        modal.querySelector('#peony-import-done').addEventListener('click', () => {
                            closeImportModal();
                            // Recarga tanto files como dashboard
                            loadDashboard().then(d => { dashboard = d; $('#peony-sync').innerHTML = renderSyncCard(); });
                            refreshContent();
                        });
                    } catch (e) {
                        modal.querySelector('div').innerHTML = `
                            <div class="p-6 text-center space-y-3">
                                <div class="text-4xl">⚠</div>
                                <div class="font-semibold text-red-900">Error en importación</div>
                                <div class="text-sm text-text-light break-words">${esc(e.message || 'Error de red')}</div>
                                <button id="peony-import-close" class="px-4 py-2 rounded-xl bg-warm-gray">Cerrar</button>
                            </div>`;
                        modal.querySelector('#peony-import-close').addEventListener('click', closeImportModal);
                    }
                }

                function bindFileHandlers() {
                    document.getElementById('peony-import-btn')?.addEventListener('click', openImportModal);
                    document.querySelectorAll('[data-file-advance]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const id = Number(btn.dataset.fileAdvance);
                            const cur = btn.dataset.current;
                            const next = cur === 'pending' ? 'validated' : cur === 'validated' ? 'synced' : 'pending';
                            btn.disabled = true;
                            try {
                                await jsonPost(`${API}?action=peony_validate`, { file_id: id, status: next });
                                await refreshContent();
                            } catch (e) {
                                alert('No se pudo actualizar: ' + (e.message || e));
                                btn.disabled = false;
                            }
                        });
                    });
                }
                function bindTabs() {
                    document.querySelectorAll('[data-tab]').forEach(b => {
                        b.addEventListener('click', () => {
                            if (s.tab === b.dataset.tab) return;
                            s.tab = b.dataset.tab;
                            s.offset = 0;
                            const tabsEl = $('#peony-tabs');
                            if (tabsEl) {
                                tabsEl.innerHTML = renderTabs();
                                bindTabs();
                            }
                            // Oculta fecha/categoría/buscar en tab Archivos (no aplican)
                            const row = $('#peony-search-row');
                            if (row) row.classList.toggle('hidden', s.tab === 'files');
                            refreshContent();
                        });
                    });
                }

                function bindFilterHandlers() {
                    document.querySelectorAll('[data-filter]').forEach(b => {
                        b.addEventListener('click', () => { s.filter = b.dataset.filter; s.offset = 0; init(); });
                    });
                    bindTabs();
                    $('#peony-date')?.addEventListener('change', e => { s.date = e.target.value; s.offset = 0; refreshContent(); });
                    $('#peony-cat')?.addEventListener('change', e => { s.category = e.target.value; s.offset = 0; refreshContent(); });
                    let searchTimer;
                    $('#peony-q')?.addEventListener('input', e => {
                        clearTimeout(searchTimer);
                        searchTimer = setTimeout(() => { s.search = e.target.value; s.offset = 0; refreshContent(); }, 300);
                    });
                }

                async function init() {
                    const root = $('#peony-root');
                    if (!root) return;
                    root.innerHTML = `<div id="peony-sync">${loadingBox()}</div>`;
                    try {
                        dashboard = await loadDashboard();
                        root.innerHTML = `
                            <div id="peony-sync">${renderSyncCard()}</div>
                            <div id="peony-tabs">${renderTabs()}</div>
                            <div id="peony-filters">${renderFilters()}</div>
                            <div id="peony-content">${loadingBox()}</div>
                        `;
                        bindFilterHandlers();
                        await refreshContent();
                    } catch (e) {
                        root.innerHTML = errorBox('No se pudo cargar el dashboard: ' + (e.message || e));
                    }
                }

                return {
                    title: 'Analizar Archivos PeonyInc',
                    back: '/precios',
                    render: () => `<div id="peony-root" class="view space-y-4"></div>`,
                    init,
                };
            })(),
            '/precios/calculadora': {
                title: 'Calculadora de Rentabilidad',
                back: '/precios',
                render: () => `
                    <div id="calc-landing" class="view space-y-3">
                        <div class="bg-gradient-to-br from-brand to-brand-dark text-white rounded-2xl p-6 text-center shadow-lg">
                            <div class="text-5xl mb-3">💼</div>
                            <div class="font-bold text-xl">Calculadora de Rentabilidad Valkam</div>
                            <div class="text-sm text-white/80 mt-2">Calcula el valor de oferta recomendado a partir del costo del material y los fletes.</div>
                            <button id="calc-open" class="mt-5 px-6 py-3 rounded-xl bg-white text-brand font-bold hover:bg-warm-white shadow-sm">
                                Abrir calculadora
                            </button>
                        </div>
                        <div id="calc-ctx-card" class="hidden bg-accent/5 border border-accent/30 rounded-2xl p-4">
                            <div class="text-xs uppercase tracking-wide text-accent-dark font-semibold mb-2">Último contexto guardado</div>
                            <div id="calc-ctx-body" class="text-sm space-y-1"></div>
                            <div class="flex gap-2 mt-3">
                                <button id="calc-open-ctx" class="px-4 py-2 rounded-xl text-sm bg-brand text-white font-semibold hover:bg-brand-dark">
                                    Abrir con este contexto
                                </button>
                                <button id="calc-clear-ctx" class="px-4 py-2 rounded-xl text-sm bg-white border border-warm-gray-dark/50 hover:bg-warm-gray">
                                    Limpiar contexto
                                </button>
                            </div>
                        </div>
                    </div>`,
                init: () => {
                    const esc = v => v == null ? '' : String(v)
                        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
                        .replaceAll('"','&quot;').replaceAll("'",'&#39;');

                    let ctx = null;
                    try { ctx = JSON.parse(localStorage.getItem('valkamsync.calculator.context') || 'null'); } catch {}

                    document.getElementById('calc-open')?.addEventListener('click', () => {
                        window.valkamsync?.openCalculator?.();
                    });

                    if (ctx && (ctx.material || ctx.phone)) {
                        const card = document.getElementById('calc-ctx-card');
                        const body = document.getElementById('calc-ctx-body');
                        if (card && body) {
                            card.classList.remove('hidden');
                            body.innerHTML = `
                                ${ctx.material  ? `<div><span class="text-text-muted">Material:</span> <strong>${esc(ctx.material)}</strong></div>` : ''}
                                ${ctx.price_raw ? `<div><span class="text-text-muted">Precio:</span> <strong class="font-mono">${esc(ctx.price_raw)}</strong>${ctx.file_date ? ' <span class="text-xs text-text-muted">('+esc(ctx.file_date)+')</span>' : ''}</div>` : ''}
                                ${ctx.company   ? `<div><span class="text-text-muted">Compañía:</span> ${esc(ctx.company)}</div>` : ''}
                                ${ctx.buyer     ? `<div><span class="text-text-muted">Contacto:</span> ${esc(ctx.buyer)}</div>` : ''}
                                ${ctx.phone     ? `<div><span class="text-text-muted">Teléfono:</span> <span class="font-mono">${esc(ctx.phone)}</span></div>` : ''}`;
                            document.getElementById('calc-open-ctx')?.addEventListener('click', () => {
                                window.valkamsync?.openCalculator?.(ctx);
                            });
                            document.getElementById('calc-clear-ctx')?.addEventListener('click', () => {
                                localStorage.removeItem('valkamsync.calculator.context');
                                card.classList.add('hidden');
                            });
                        }
                    }
                }
            }
        };

        function placeholder(msg) {
            return `
                <div class="view bg-white rounded-2xl border border-dashed border-warm-gray-dark p-8 text-center">
                    <div class="text-text-muted text-sm uppercase tracking-wide mb-2">Próximo paso</div>
                    <div class="text-text font-medium">${msg}</div>
                </div>
            `;
        }

        // --------- Router ---------
        const app = document.getElementById('app');
        const headerTitle = document.getElementById('header-title');
        const btnBack = document.getElementById('btn-back');

        function parseRoute() {
            const raw = (location.hash || '#/').replace(/^#/, '');
            return raw.startsWith('/') ? raw : '/' + raw;
        }

        function navigate(path) {
            location.hash = '#' + path;
        }

        function render() {
            const path = parseRoute();
            const view = views[path] || views['/'];

            headerTitle.textContent = view.title;
            app.innerHTML = view.render();

            if (view.back !== null) {
                btnBack.classList.remove('hidden');
                btnBack.onclick = () => navigate(view.back);
            } else {
                btnBack.classList.add('hidden');
                btnBack.onclick = null;
            }

            // Bind data-nav buttons
            app.querySelectorAll('[data-nav]').forEach(el => {
                el.addEventListener('click', () => navigate(el.dataset.nav));
            });

            window.scrollTo(0, 0);

            // Vistas con lifecycle asíncrono (fetch, bind handlers)
            if (typeof view.init === 'function') {
                try { view.init(); } catch (e) { console.error('[view.init]', e); }
            }
        }

        window.addEventListener('hashchange', render);
        window.addEventListener('DOMContentLoaded', render);

        // Botón calculadora del header global (visible en todas las vistas)
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-calc')?.addEventListener('click', () => {
                window.valkamsync?.openCalculator?.();
            });
        });
    })();
    </script>
</body>
</html>

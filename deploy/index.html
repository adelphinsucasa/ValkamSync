            -webkit-tap-highlight-color: transparent;
        }
        .tile {
            min-height: 140px;
            transition: transform 0.08s ease, box-shadow 0.15s ease;
        }
        .tile:active { transform: scale(0.97); }
        .view { animation: fade 0.15s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* ----- Print / Export PDF ----- */
        [data-print-only] { display: none; }
        @media print {
            header, footer, #btn-back,
            #cli-filters, #cli-quick,
            [data-toggle], [data-edit], [data-qf],
            #cli-modal, #cli-pager, #cli-actions {
                display: none !important;
            }
            body { background: white !important; color: #000 !important; }
            .shadow-sm,.shadow-md,.shadow-xl,.shadow-2xl { box-shadow: none !important; }
            a[href^="tel:"] { color: #000 !important; text-decoration: none !important; }
            [data-print-only] { display: block !important; }
            .cli-card { page-break-inside: avoid; break-inside: avoid; border: 1px solid #bbb !important; background: white !important; margin-bottom: 4px !important; }
            main { max-width: none !important; padding: 0 !important; }
            @page { margin: 12mm; }
        }

                if (v == null || v === '') return 0;
                const n = parseFloat(String(v).replace(/,/g, '.').replace(/[^\d.\-]/g, ''));
                return isFinite(n) && n >= 0 ? n : 0;

                const cap = parseNum(state.capacity);

                const m   = Math.max(0, Math.min(200, parseNum(state.margin)));
                const total = cp + fo + fd;
                const marginAmt = total * (m / 100);
                const recommended = total + marginAmt;
                const perUnit = cap > 0 ? recommended / cap : null;
                return { cap, total, marginAmt, recommended, perUnit, margin: m };

                }

                async function clientGeminiExtract(file) {
                    const key = getOrPromptGeminiKey();
                    if (!key) throw new Error('Sin API key no se puede procesar en modo local.');

                    const base64 = await fileToBase64(file);
                    const mime   = file.type || 'image/jpeg';

                    const prompt = 'Eres un asistente de OCR para ValkamSync, analizando fotos de tarjetas de presentación, '
                        + 'agendas físicas o notas de clientes del sector de reciclaje de metales.\n\n'
                        + 'Extrae los campos identificables y retorna EXCLUSIVAMENTE JSON válido:\n'
                        + '{\n'
                        + '  "phone": "teléfono tal como aparece (con código país si se ve)",\n'
                        + '  "company": "nombre de empresa",\n'
                        + '  "buyer": "nombre de persona de contacto",\n'
                        + '  "material": "material mencionado o null",\n'
                        + '  "price_raw": "precio tal como aparece (ej 1.40, 0.72/Al) o null",\n'
                        + '  "scan_date": "fecha escrita en formato YYYY-MM-DD o null",\n'
                        + '  "notes": "otra info relevante (dirección, email, etc.) o null",\n'
                        + '  "confidence": "alta | media | baja"\n'
                        + '}\n\n'
                        + 'Reglas: usa null (no string vacío) si no se puede determinar. No inventes datos. '
                        + 'Retorna SOLO el JSON, sin markdown, sin ```.';

                    const body = {
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: mime, data: base64 } }
                            ]
                        }],
                        generationConfig: {
                            temperature: 0.1,
                            // 2048 cubre JSON completo; 800 truncaba con gemini-2.5
                            maxOutputTokens: 2048,
                            response_mime_type: 'application/json',
                            // Gemini 2.5 usa thinking tokens por default → desactivar para OCR
                            thinkingConfig: { thinkingBudget: 0 },
                        }
                    };

                    // Cadena de modelos con fallback — gemini-1.5 fue deprecado en 2025
                    const GEMINI_MODELS_FALLBACK = [
                        'gemini-2.5-flash',
                        'gemini-2.0-flash',
                        'gemini-2.5-flash-lite',
                        'gemini-flash-latest',
                    ];
                    let resp, lastMsg = '';
                    for (let i = 0; i < GEMINI_MODELS_FALLBACK.length; i++) {
                        const model = GEMINI_MODELS_FALLBACK[i];
                        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
                        try {
                            resp = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(body),
                            });
                        } catch (e) {
                            throw new Error('No se pudo conectar con Gemini. Revisa tu conexión.');
                        }
                        if (resp.ok) break;
                        // Captura error y decide si probar siguiente
                        try { const j = await resp.clone().json(); lastMsg = j?.error?.message || ('HTTP ' + resp.status); } catch { lastMsg = 'HTTP ' + resp.status; }
                        if (resp.status === 400 && /API.?key|key.?not.?valid/i.test(lastMsg)) {
                            localStorage.removeItem(GEMINI_KEY_LS);
                            throw new Error('API key inválida. La borré — vuelve a intentar con una válida.');
                        }
                        const deprecated = /not found|not supported/i.test(lastMsg) || resp.status === 404;
                        if (!deprecated) break;  // otros errores: no reintentes
                        // else: sigue al siguiente modelo
                    }
                    if (!resp?.ok) {
                        throw new Error('Gemini: ' + (lastMsg || 'sin respuesta'));
                    }
                    const data = await resp.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    const finishReason = data?.candidates?.[0]?.finishReason || '';
                    let fields;
                    try { fields = JSON.parse(text); }
                    catch {
                        const stripped = String(text).replace(/^```(?:json)?\s*|\s*```\s*$/gm, '').trim();
                        try { fields = JSON.parse(stripped); }
                        catch {
                            // Detectar truncación por límite de tokens
                            if (finishReason === 'MAX_TOKENS' || !text.trim().endsWith('}')) {
                                throw new Error('Gemini truncó la respuesta (MAX_TOKENS). Reintenta; si persiste, reduce el tamaño de la imagen.');
                            }
                            throw new Error('Gemini devolvió respuesta no-JSON: ' + text.substring(0, 140));
                        }
                    }
                    return {
                        phone:      fields.phone      ?? null,
                        company:    fields.company    ?? null,
                        buyer:      fields.buyer      ?? null,
                        material:   fields.material   ?? null,
                        price_raw:  fields.price_raw  ?? null,
                        scan_date:  fields.scan_date  ?? null,
                        notes:      fields.notes      ?? null,
                        confidence: fields.confidence ?? null,
                    };
                }

                function clientFindExisting(phone) {
                    if (!phone) return null;
                    const norm = phoneNorm(phone);
                    if (!norm) return null;
                    // 1) Bootstrap peony embebido
                    try {
                        const el = document.getElementById('peony-bootstrap-data');
                        if (el) {
                            const bs = JSON.parse(el.textContent);
                            const matches = (bs.rows || []).filter(r => phoneNorm(r.phone) === norm);
                            if (matches.length) {
                                const latest = matches.reduce((a, b) => (a.date > b.date ? a : b));
                                return {
                                    source: 'peony', phone: latest.phone,
                                    company: latest.company, buyer: latest.buyer,
                                    hits: matches.length, last_seen: latest.date,
                                };
                            }
                        }
                    } catch {}
                    // 2) Scans locales previos
                    try {
                        const scans = JSON.parse(localStorage.getItem(SCAN_STORE_LS) || '[]');
                        const match = scans.find(x => phoneNorm(x.phone) === norm);
                        if (match) {
                            return {
                                source: 'manual', phone: match.phone,
                                company: match.company, buyer: match.buyer,
                                hits: match.scan_count || 1,
                                last_seen: match.scan_date || match.saved_at,
                            };
                        }
                    } catch {}
                    return null;
                }

                function clientSaveScan(data) {
                    let scans = [];
                    try { scans = JSON.parse(localStorage.getItem(SCAN_STORE_LS) || '[]'); } catch {}
                    const norm = phoneNorm(data.phone);
                    const now = new Date().toISOString();
                    const idx = scans.findIndex(x => phoneNorm(x.phone) === norm);
                    if (idx >= 0) {
                        scans[idx] = { ...scans[idx], ...data, phone_norm: norm, saved_at: now,
                            scan_count: (scans[idx].scan_count || 1) + 1 };
                    } else {
                        scans.push({ ...data, phone_norm: norm, saved_at: now, scan_count: 1 });
                    }
                    localStorage.setItem(SCAN_STORE_LS, JSON.stringify(scans));
                    return { ok: true, phone: data.phone, local: true };
                }
                // ========== Fin fallback client-side ==========

                async function analyze() {
                    s.step = 'analyzing';
                    s.error = null;
                    s.clientMode = false;
                    render();
                    startAnalyzeTimer();

                    // Intento 1: backend
                    let backendOK = false;
                    try {
                        const fd = new FormData();
                        fd.append('image', s.file);
                        const r = await postForm(`${API}?action=scan_extract`, fd);
                        if (r?.ok) {
                            s.extracted    = r.extracted || null;
                            s.existing     = r.existing  || null;
                            s.aiAvailable  = !!r.ai_available;
                            s.aiError      = r.ai_error || null;
                            s.image_sha256 = r.image_sha256 || null;
                            backendOK = true;
                        } else if (r?.error) {
                            throw new Error(r.error);
                        }
                    } catch (e) {
                        // backend no reachable o falló
                    }

                    // Intento 2: Gemini directo desde el navegador
                    if (!backendOK) {
                        try {
                            s.extracted    = await clientGeminiExtract(s.file);
                            s.existing     = clientFindExisting(s.extracted?.phone);
                            s.aiAvailable  = true;
                            s.aiError      = null;
                            s.image_sha256 = null;
                            s.clientMode   = true;
                        } catch (e) {
                            stopAnalyzeTimer();
                            s.error = 'Backend no disponible. Gemini local falló: ' + (e.message || e);
                            s.step  = 'error';
                            render();
                            return;
                        }
                    }

                    stopAnalyzeTimer();
                    // Prefill form
                    const ex  = s.extracted || {};
                    const old = s.existing  || {};
                    s.form = {
                        phone:     ex.phone     || old.phone   || '',
                        company:   ex.company   || old.company || '',
                        buyer:     ex.buyer     || old.buyer   || '',
                        material:  ex.material  || '',
                        price_raw: ex.price_raw || '',
                        scan_date: ex.scan_date || new Date().toISOString().slice(0,10),
                        notes:     ex.notes     || '',
                    };
                    recomputeChanges();
                    s.step = 'review';
                    render();
                }

                function recomputeChanges() {
                    if (!s.existing) {
                        s.changes = { phone: false, company: false, buyer: false };
                        return;
                    }
                    s.changes.phone   = phoneNorm(s.form.phone) !== phoneNorm(s.existing.phone);
                    s.changes.company = (s.form.company || '') !== (s.existing.company || '');
                    s.changes.buyer   = (s.form.buyer   || '') !== (s.existing.buyer   || '');
                }

                async function lookupByPhone() {
                    const p = (s.form.phone || '').trim();
                    if (!p) { s.existing = null; recomputeChanges(); render(); return; }
                    try {
                        const r = await getJson(`${API}?action=scan_lookup&phone=${encodeURIComponent(p)}`);
                        s.existing = r?.existing || null;
                    } catch {
                        // Backend no reachable → lookup local
                        s.existing = clientFindExisting(p);
                    }
                    recomputeChanges();
                    render();
                }

                async function save() {
                    syncFormFromDOM();
                    if (!s.form.phone.trim()) { alert('El teléfono es obligatorio.'); return; }

                    // Confirmación si sustituirá nombre/teléfono existentes
                    if (s.existing && (s.changes.phone || s.changes.company || s.changes.buyer)) {
                        const fields = [];
                        if (s.changes.phone)   fields.push(`teléfono: "${s.existing.phone || '—'}" → "${s.form.phone}"`);
                        if (s.changes.company) fields.push(`compañía: "${s.existing.company || '—'}" → "${s.form.company}"`);
                        if (s.changes.buyer)   fields.push(`contacto: "${s.existing.buyer || '—'}" → "${s.form.buyer}"`);
                        const msg = 'Los datos anteriores serán SUSTITUIDOS:\n\n• ' + fields.join('\n• ') +
                                    '\n\nEsto se aplicará al registro del cliente. ¿Continuar?';
                        if (!confirm(msg)) return;
                    }

                    s.step = 'saving';
                    render();
                    const payload = {
                        ...s.form,
                        image_sha256: s.image_sha256,
                        confidence:   s.extracted?.confidence || null,
                    };
                    try {
                        let r;
                        try {
                            r = await postJson(`${API}?action=scan_save`, payload);
                            if (!r?.ok) throw new Error(r?.error || 'save_failed');
                        } catch (backendErr) {
                            // Fallback: localStorage (modo file:// o backend caído)
                            r = clientSaveScan(payload);
                        }
                        s.savedPhone = r.phone;
                        s.savedLocal = !!r.local;
                        s.step = 'saved';
                        render();
                    } catch (e) {
                        s.error = e.message || String(e);
                        s.step = 'error';
                        render();
                    }
                }

                function reset(keepPreview) {
                    closeWebcam();
                    if (!keepPreview && s.preview) URL.revokeObjectURL(s.preview);
                    Object.assign(s, {
                        step: 'capture', file: null, preview: keepPreview ? s.preview : null,
                        extracted: null, existing: null, aiAvailable: null, aiError: null,
                        image_sha256: null, error: null, savedPhone: null,
                        form: { phone:'', company:'', buyer:'', material:'', price_raw:'', scan_date:'', notes:'' },
                        changes: { phone: false, company: false, buyer: false },
                    });
                    render();
                }

                // --------- Webcam (getUserMedia) para desktop ---------
                let _stream = null;
                const isTouchPrimary = () => matchMedia('(hover: none) and (pointer: coarse)').matches;
                const hasWebcam       = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

                async function openWebcam() {
                    if (!hasWebcam()) {
                        alert('Tu navegador no permite acceso a la cámara. Usa "Archivo".');
                        return;
                    }
                    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                        alert('La cámara solo funciona en HTTPS o localhost. Usa el botón "Archivo".');
                        return;
                    }
                    try {
                        const constraints = {
                            video: {
                                facingMode: { ideal: 'environment' },
                                width:  { ideal: 1920 },
                                height: { ideal: 1080 },
                            },
                            audio: false,
                        };
                        _stream = await navigator.mediaDevices.getUserMedia(constraints);
                        s.step = 'camera-live';
                        render();
                        // Atacha el stream al elemento video tras el render
                        const v = document.getElementById('scan-video');
                        if (v) {
                            v.srcObject = _stream;
                            v.play().catch(() => {});
                        }
                    } catch (e) {
                        const msg = (e && e.name === 'NotAllowedError')
                            ? 'Permiso denegado. Autoriza la cámara en la barra de direcciones y vuelve a intentar.'
                            : (e && e.name === 'NotFoundError')
                                ? 'No se detectó ninguna cámara en este dispositivo.'
                                : 'No se pudo acceder a la cámara: ' + (e?.message || e);
                        alert(msg);
                    }
                }

                function closeWebcam() {
                    if (_stream) {
                        _stream.getTracks().forEach(t => { try { t.stop(); } catch {} });
                        _stream = null;
                    }
                }

                function captureFromVideo() {
                    const v = document.getElementById('scan-video');
                    if (!v || v.readyState < 2 || !v.videoWidth) { alert('Video aún no listo.'); return; }
                    const canvas = document.createElement('canvas');
                    canvas.width  = v.videoWidth;
                    canvas.height = v.videoHeight;
                    canvas.getContext('2d').drawImage(v, 0, 0);
                    canvas.toBlob(blob => {
                        if (!blob) { alert('No se pudo capturar frame.'); return; }
                        const file = new File([blob], 'webcam-' + Date.now() + '.jpg', { type: 'image/jpeg' });
                        closeWebcam();
                        onFile(file);
                    }, 'image/jpeg', 0.92);
                }

                // Limpieza global: si el usuario navega fuera o cierra la pestaña, liberamos la cámara
                window.addEventListener('hashchange', closeWebcam);
                window.addEventListener('beforeunload', closeWebcam);

                function syncFormFromDOM() {
                    ['phone','company','buyer','material','price_raw','scan_date','notes'].forEach(k => {
                        const el = document.getElementById('scan-f-'+k);
                        if (el) s.form[k] = el.value;
                    });
                    recomputeChanges();
                }

                // --------- Renderers ---------
                function renderCapture() {
                    const hasImg = !!s.preview;
                    // Desktop + getUserMedia disponible → webcam en vivo
                    // Mobile (touch) → input file con capture (abre cámara nativa)
                    // Sin getUserMedia ni touch → solo file picker
                    const useLive = hasWebcam() && !isTouchPrimary();
                    const camButton = useLive
                        ? `<button id="scan-webcam" class="px-4 py-3 rounded-xl bg-brand text-white font-semibold hover:bg-brand-dark flex items-center justify-center gap-2">
                               📷 Abrir cámara
                           </button>`
                        : `<label class="cursor-pointer px-4 py-3 rounded-xl bg-brand text-white font-semibold hover:bg-brand-dark flex items-center justify-center gap-2">
                               📷 Tomar foto
                               <input type="file" accept="image/*" capture="environment" class="hidden" id="scan-cam"/>
                           </label>`;
                    return `
                        <div class="bg-white rounded-2xl border border-warm-gray-dark/50 p-5 text-center space-y-4">
                            ${hasImg
                                ? `<img src="${esc(s.preview)}" class="max-w-full max-h-64 mx-auto rounded-xl border border-warm-gray-dark/30"/>`
                                : `<div class="py-6"><div class="text-6xl">📷</div></div>`}
                            <div>
                                <div class="font-semibold text-text">${hasImg ? 'Imagen lista' : 'Escanear tarjeta o agenda'}</div>
                                <div class="text-sm text-text-muted mt-1">La IA (Gemini) extraerá los campos del cliente automáticamente.</div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                ${camButton}
                                <label class="cursor-pointer px-4 py-3 rounded-xl bg-white border border-warm-gray-dark/50 hover:bg-warm-gray flex items-center justify-center gap-2">
                                    📁 Archivo
                                    <input type="file" accept="image/*" class="hidden" id="scan-upl"/>
                                </label>
                            </div>
                            ${hasImg ? `
                                <button id="scan-analyze" class="w-full px-4 py-3 rounded-xl bg-accent text-white font-semibold hover:bg-accent-dark">
                                    ✨ Analizar con IA
                                </button>
                                <button id="scan-clear" class="w-full px-3 py-2 text-sm text-text-muted">Elegir otra imagen</button>
                            ` : `
                                <button id="scan-manual" class="w-full px-3 py-2 text-sm text-accent-dark underline">
                                    ... o completar manualmente sin foto
                                </button>
                            `}
                        </div>`;
                }

                function renderCameraLive() {
                    return `
                        <div class="space-y-2">
                            <div class="bg-black rounded-2xl overflow-hidden relative shadow-lg">
                                <video id="scan-video" playsinline autoplay muted
                                    class="w-full max-h-[70vh] object-contain bg-black block"></video>
                                <div class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex items-center justify-between">
                                    <button id="scan-cam-cancel"
                                        class="px-4 py-2 rounded-xl bg-white/15 text-white backdrop-blur hover:bg-white/25 text-sm font-medium">
                                        Cancelar
                                    </button>
                                    <button id="scan-cam-capture"
                                        aria-label="Capturar"
                                        class="w-16 h-16 rounded-full bg-white border-4 border-brand flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition">
                                        <div class="w-12 h-12 rounded-full bg-brand"></div>
                                    </button>
                                    <div class="w-[88px]"></div>
                                </div>
                            </div>
                            <div class="text-center text-xs text-text-muted">
                                Encuadra la tarjeta o agenda y presiona el botón blanco.
                            </div>
                        </div>`;
                }

                function renderAnalyzing() {
                    return `
                        <div class="bg-white rounded-2xl border border-warm-gray-dark/50 p-8 text-center space-y-4">
                            ${s.preview ? `<img src="${esc(s.preview)}" class="max-w-full max-h-48 mx-auto rounded-xl opacity-60"/>` : ''}
                            <div class="inline-block w-10 h-10 border-4 border-warm-gray-dark border-t-accent rounded-full animate-spin"></div>
                            <div class="font-semibold">Analizando imagen <span id="scan-timer" class="font-mono text-accent-dark">0s</span></div>
                            <div class="text-sm text-text-muted">Gemini está extrayendo los campos.</div>
                            <div class="mt-2 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 inline-block">
                                ⏱ Puede tardar hasta <strong>1 minuto</strong> en imágenes grandes o si el servidor está ocupado. No cierres esta ventana.
                            </div>
                        </div>`;
                }

                // Timer visible durante analyze()
                let _analyzeInterval = null, _analyzeStart = 0;
                function startAnalyzeTimer() {
                    stopAnalyzeTimer();
                    _analyzeStart = Date.now();
                    _analyzeInterval = setInterval(() => {
                        const el = document.getElementById('scan-timer');
                        if (el) el.textContent = Math.floor((Date.now() - _analyzeStart) / 1000) + 's';
                    }, 500);
                }
                function stopAnalyzeTimer() {
                    if (_analyzeInterval) { clearInterval(_analyzeInterval); _analyzeInterval = null; }
                }

                function fieldInput(key, label, type, hasChange, oldVal) {
                    const val = s.form[key];
                    return `
                        <label class="block">
                            <div class="flex items-center justify-between mb-1 gap-2">
                                <span class="block text-xs uppercase tracking-wide text-text-muted">${label}</span>
                                ${hasChange ? `
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-red-50 text-red-800 border border-red-200" title="Valor anterior">
                                        ⚠ era "${esc(oldVal || '—')}"
                                    </span>` : ''}
                            </div>
                            <input type="${type}" id="scan-f-${key}" value="${esc(val)}"
                                class="w-full px-3 py-2 rounded-xl border ${hasChange ? 'border-red-300 bg-red-50/30 focus:border-red-500 focus:ring-red-200' : 'border-warm-gray-dark/50 bg-white focus:border-brand focus:ring-brand/20'} text-sm focus:outline-none focus:ring-2"/>
                        </label>`;
                }
                function fieldTextarea(key, label, placeholder) {
                    return `
                        <label class="block">
                            <span class="block text-xs uppercase tracking-wide text-text-muted mb-1">${label}</span>
                            <textarea id="scan-f-${key}" rows="3" placeholder="${esc(placeholder)}"
                                class="w-full px-3 py-2 rounded-xl border border-warm-gray-dark/50 bg-white text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 resize-none">${esc(s.form[key])}</textarea>
                        </label>`;
                }

                function renderReview() {
                    const ex = s.existing;
                    const localBadge = s.clientMode
                        ? `<div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-sm text-blue-900">
                                <strong>Modo local:</strong> Gemini procesó la imagen directo desde tu navegador (sin backend). Al guardar, el registro queda en <code>localStorage</code> hasta que haya servidor.
                           </div>`
                        : '';
                    const aiBanner = s.aiAvailable === false
                        ? `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800">
                                IA no configurada — complete los campos a mano.
                           </div>`
                        : s.aiError
                            ? `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800">
                                    IA falló (${esc(s.aiError)}). Complete o corrija a mano.
                               </div>`
                            : '';
                    const existingBanner = ex ? `
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex gap-2">
                            <svg class="w-5 h-5 text-amber-700 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M4.93 19h14.14c1.54 0 2.5-1.67 1.73-3L13.73 4a2 2 0 00-3.46 0L3.2 16c-.77 1.33.19 3 1.73 3z"/>
                            </svg>
                            <div class="text-sm">
                                <div class="font-semibold text-amber-900">Cliente existente detectado</div>
                                <div class="text-amber-800">
                                    Teléfono <strong>${esc(ex.phone)}</strong> coincide con
                                    <strong>${esc(ex.company || ex.buyer || '—')}</strong>
                                    (${ex.source === 'peony' ? 'origen PeonyInc' : 'escaneo previo'},
                                    ${ex.hits || 0} registro${(+ex.hits === 1) ? '' : 's'})
                                </div>
                                ${(s.changes.phone || s.changes.company || s.changes.buyer)
                                    ? `<div class="text-xs text-amber-700 mt-1">Los campos en rojo se van a <strong>sustituir</strong>. Edita antes de guardar si quieres mantener el valor anterior.</div>`
                                    : ''}
                            </div>
                        </div>` : '';

                    return `
                        <div class="space-y-3">
                            ${localBadge}
                            ${aiBanner}
                            ${existingBanner}
                            ${s.preview ? `<img src="${esc(s.preview)}" class="max-w-full max-h-40 mx-auto rounded-xl border border-warm-gray-dark/30"/>` : ''}

                            <div class="bg-white rounded-2xl border border-warm-gray-dark/50 p-4 space-y-3">
                                <div class="flex items-center justify-between">
                                    <div class="text-xs uppercase tracking-wide text-text-muted">Datos del cliente</div>

                function renderSaved() {

                function render() {
                    const root = document.getElementById('scan-root');
                    if (!root) return;
                    const step = s.step;
                    root.innerHTML =
                        step === 'capture' || step === 'ready' ? renderCapture() :
                        step === 'camera-live'                 ? renderCameraLive() :
                        step === 'analyzing'                   ? renderAnalyzing() :
                        step === 'review'                      ? renderReview() :

                                    span.title = 'Valor anterior';

                                    el.classList.add('border-red-300','bg-red-50/30');
                                    el.classList.remove('border-warm-gray-dark/50','bg-white');

                function init() { reset(false); }

                return {
                    title: 'Escanear Cliente',

                    render: () => `<div id="scan-root" class="view space-y-3"></div>`,

            })(),
            '/clientes/listado': (() => {
                // =====================================================================
                // Vista "Listado de Clientes" — directorio derivado de vsync_peony_prices
                // Agrupa por teléfono (clave natural). Fallback al bootstrap JSON.
                // =====================================================================
                const API = 'api.php';
                const BOOTSTRAP_URL = '../tmp/peony_prices.json';

                const s = {
                    search: '',
                    category: '',
                    quick: 'all',                                 // all|today|overdue|week|pending|scheduled|contacted|discarded
                    offset: 0,
                    limit: 50,
                    expanded: null,                               // tel. del cliente con historial abierto
                    historySort: { col: 'latest', dir: 'desc' },
                    modal: null,                                  // {phone, client, notes, status, ...}
                };
                let backendMode = 'unknown';   // 'api' | 'json'
                let _bootstrap = null;
                let _lastClients = [];
                let _lastStats = null;
                // Normaliza teléfonos a dígitos (preservando + para internacional).
                // CRÍTICO: todas las claves de localStorage y payloads API usan la forma normalizada
                // para que el mismo contacto con formatos distintos ("704-555-1234" vs "(704) 555-1234")
                // comparta notas/estado. El display sigue usando el formato original.
                const phoneNorm = p => {
                    const str = String(p ?? '').trim();
                    if (!str) return '';
                    const lead = str.startsWith('+') ? '+' : '';
                    return lead + str.replace(/\D+/g, '');
                };
                const LS_NOTES  = phone => `valkamsync.client_notes.${phoneNorm(phone)}`;
                const LS_STATUS = phone => `valkamsync.client_status.${phoneNorm(phone)}`;
                const todayISO = () => new Date().toISOString().slice(0,10);

                const esc = v => v == null ? '' : String(v)
                    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
                    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
                const $ = (sel, ctx = document) => ctx.querySelector(sel);
                const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
                const fmtFechaShort = iso => {
                    if (!iso) return '—';
                    const d = new Date(iso);
                    if (isNaN(d)) return iso;
                    return `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
                };

                async function jsonGet(url) {
                    const r = await fetch(url, { credentials: 'same-origin' });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }
                async function jsonPost(url, body) {
                    const r = await fetch(url, {
                        method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }
                async function getBootstrap() {
                    if (_bootstrap) return _bootstrap;
                    // Primero: tag <script> embebido (funciona bajo file:// sin CORS)
                    const embed = document.getElementById('peony-bootstrap-data');
                    if (embed && embed.textContent.trim()) {
                        try { _bootstrap = JSON.parse(embed.textContent); return _bootstrap; }
                        catch (e) { console.warn('[bootstrap] JSON embed inválido, caigo a fetch', e); }
                    }
                    // Fallback: fetch (falla bajo file:// por CORS — requiere servir con HTTP)
                    try {
                        _bootstrap = await jsonGet(BOOTSTRAP_URL);
                        return _bootstrap;
                    } catch (e) {
                        throw new Error('No se pudo cargar el dataset bootstrap. ' +
                            (location.protocol === 'file:'
                                ? 'Abre la app servida por HTTP (ej. php -S localhost:8080 -t deploy) o recarga tras asegurarte que el JSON embebido esté presente.'
                                : 'Verifica ' + BOOTSTRAP_URL));
                    }
                }

                async function loadClients() {
                    if (backendMode === 'json') return clientsFromBootstrap();
                    try {
                        const qs = new URLSearchParams({
                            action: 'peony_clients',
                            q: s.search, category: s.category, quick: s.quick,
                            offset: s.offset, limit: s.limit,
                        });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) { backendMode = 'api'; return r; }
                        throw new Error();
                    } catch {
                        backendMode = 'json';
                        return clientsFromBootstrap();
                    }
                }

                async function loadStats() {
                    if (backendMode === 'api') {
                        try {
                            const r = await jsonGet(`${API}?action=peony_clients_stats`);
                            if (r?.ok) return r;
                        } catch {}
                    }
                    return statsFromLocal();
                }
                function statsFromLocal() {
                    // Deriva conteos barriendo _lastClients (ya con status enriquecido del fallback)
                    const list = _lastClients.length ? _lastClients : [];
                    const today = todayISO();
                    const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
                    const we = weekEnd.toISOString().slice(0,10);
                    const st = { total: list.length, overdue: 0, today_count: 0, week_count: 0,
                                 pending: 0, scheduled: 0, contacted: 0, discarded: 0 };
                    for (const c of list) {
                        const s_ = c.status || 'pending';
                        if (s_ === 'pending')   st.pending++;
                        if (s_ === 'scheduled') st.scheduled++;
                        if (s_ === 'contacted') st.contacted++;
                        if (s_ === 'discarded') st.discarded++;
                        if (s_ === 'scheduled' && c.next_contact_date) {
                            if (c.next_contact_date < today) st.overdue++;
                            if (c.next_contact_date === today) st.today_count++;
                            if (c.next_contact_date >= today && c.next_contact_date <= we) st.week_count++;
                        }
                    }
                    return { ok: true, today, stats: st };
                }

                // Status per-cliente: carga/guarda en localStorage cuando no hay API
                function loadStatusLocal(phone) {
                    try { return JSON.parse(localStorage.getItem(LS_STATUS(phone))) || null; }
                    catch { return null; }
                }
                function saveStatusLocal(phone, patch) {
                    const cur = loadStatusLocal(phone) || { phone, status: 'pending' };
                    const next = { ...cur, ...patch, updated_at: new Date().toISOString() };
                    if (patch.status === 'contacted' || patch.mark_contacted_now) next.last_contact_at = new Date().toISOString();
                    localStorage.setItem(LS_STATUS(phone), JSON.stringify(next));
                    return next;
                }
                async function saveClientStatus(phone, patch) {
                    const norm = phoneNorm(phone);
                    if (backendMode === 'api') {
                        try {
                            const r = await jsonPost(`${API}?action=peony_client_status_update`, { phone: norm, ...patch });
                            if (r?.ok) return r.status;
                            throw new Error(r?.error || 'api_fail');
                        } catch (e) { throw e; }
                    }
                    return saveStatusLocal(norm, patch);
                }
                async function clientsFromBootstrap() {
                    const d = await getBootstrap();
                    // Agrupa por teléfono NORMALIZADO para unificar formatos del mismo contacto
                    const byPhone = new Map();
                    for (const r of d.rows) {
                        const norm = phoneNorm(r.phone);
                        if (!norm) continue;
                        if (s.category && r.category !== s.category) continue;
                        if (s.search) {
                            const q = s.search.toLowerCase();
                            if (!((r.company+' '+r.buyer+' '+r.phone).toLowerCase().includes(q))) continue;
                        }
                        if (!byPhone.has(norm)) {
                            byPhone.set(norm, {
                                phone: r.phone,                  // display: formato del último registro
                                phone_norm: norm,
                                company: r.company,
                                buyer: r.buyer,
                                categories: new Set(),
                                materials: new Set(),
                                row_count: 0,
                                first_seen: r.date,
                                last_seen: r.date,
                            });
                        }
                        const c = byPhone.get(norm);
                        c.categories.add(r.category);
                        c.materials.add(r.material);
                        c.row_count++;
                        if (r.date > c.last_seen)   { c.last_seen = r.date; c.phone = r.phone; c.company = r.company; c.buyer = r.buyer; }
                        if (r.date < c.first_seen)  c.first_seen = r.date;
                    }
                    const today = todayISO();
                    let list = [...byPhone.values()].map(c => {
                        const st = loadStatusLocal(c.phone) || {};
                        const status = st.status || 'pending';
                        const next_contact_date = st.next_contact_date || null;
                        const notes = loadNotesLocal ? loadNotesLocal(c.phone) : [];
                        return {
                            phone: c.phone, company: c.company, buyer: c.buyer,
                            categories: [...c.categories],
                            material_count: c.materials.size,
                            row_count: c.row_count,
                            first_seen: c.first_seen, last_seen: c.last_seen,
                            notes_count: Array.isArray(notes) ? notes.length : 0,
                            status, next_contact_date,
                            last_contact_at: st.last_contact_at || null,
                            overdue:   status === 'scheduled' && next_contact_date && next_contact_date < today,
                            due_today: status === 'scheduled' && next_contact_date === today,
                        };
                    });

                    // Quick filter en cliente (espejo de la query server-side)
                    const weekEnd = (() => { const d = new Date(); d.setDate(d.getDate()+7); return d.toISOString().slice(0,10); })();
                    list = list.filter(c => {
                        switch (s.quick) {
                            case 'overdue':  return c.overdue;
                            case 'today':    return c.due_today;
                            case 'week':     return c.status === 'scheduled' && c.next_contact_date && c.next_contact_date >= today && c.next_contact_date <= weekEnd;
                            case 'pending':  return (c.status || 'pending') === 'pending';
                            case 'scheduled':return c.status === 'scheduled';
                            case 'contacted':return c.status === 'contacted';
                            case 'discarded':return c.status === 'discarded';
                            default:         return true;
                        }
                    });

                    // Orden: overdue → today → scheduled futuro → pending → contacted → discarded
                    const rank = c => c.overdue ? 0 : c.due_today ? 1 : c.status === 'scheduled' ? 2
                                    : (c.status||'pending') === 'pending' ? 3
                                    : c.status === 'contacted' ? 4 : 5;
                    list.sort((a,b) => rank(a) - rank(b)
                                    || b.last_seen.localeCompare(a.last_seen)
                                    || (a.company||'').localeCompare(b.company||''));

                    const total = list.length;
                    return {
                        ok: true, total, limit: s.limit, offset: s.offset,
                        quick: s.quick, today,
                        clients: list.slice(s.offset, s.offset + s.limit),
                    };
                }

                async function loadClientDetail(phone) {
                    if (backendMode === 'json') return detailFromBootstrap(phone);
                    try {
                        const qs = new URLSearchParams({ action: 'peony_client', phone });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) return r;
                        throw new Error();
                    } catch {
                        return detailFromBootstrap(phone);
                    }
                }
                async function detailFromBootstrap(phone) {
                    const d = await getBootstrap();
                    const rows = d.rows.filter(r => r.phone === phone).map(r => ({
                        file_date: r.date, category: r.category, material: r.material,
                        price_raw: r.price_raw, price_num: parseFloat(r.price_raw) || null,
                        price_unit: null, delivery_basis: r.delivery_basis,
                        company: r.company, buyer: r.buyer,
                    }));
                    rows.sort((a,b) => b.file_date.localeCompare(a.file_date)
                                    || a.category.localeCompare(b.category)
                                    || a.material.localeCompare(b.material));
                    return { ok: true, phone, count: rows.length, rows };
                }

                // --------- UI ---------
                function loadingBox() {
                    return `
                        <div class="bg-white rounded-2xl border border-warm-gray-dark/50 p-8 text-center">

                            <div class="mt-3 text-text-light text-sm">Cargando clientes…</div>
                        </div>`;
                }
                function emptyBox(msg) {

                }

                }

                function renderHeader(data) {

                    return `

                                <div class="text-lg font-bold">ValkamSync · Listado de Clientes</div>
                                <div class="text-sm">Filtro: ${esc(quickLabel(s.quick))}${s.category?' · '+esc(s.category):''}${s.search?' · búsqueda "'+esc(s.search)+'"':''}</div>

                                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>

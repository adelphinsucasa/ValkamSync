                }

                function renderQuickFilters(stats) {
                    const items = [
                        { key: 'all',       label: 'Todos',       count: stats?.total      ?? 0, color: 'bg-white border-warm-gray-dark/50 text-text' },
                        { key: 'today',     label: '⏰ Hoy',      count: stats?.today_count ?? 0, color: 'bg-orange-50 border-orange-200 text-orange-800' },
                        { key: 'overdue',   label: '⚠ Retrasados',count: stats?.overdue    ?? 0, color: 'bg-red-50 border-red-200 text-red-800' },
                        { key: 'week',      label: '📅 Esta semana', count: stats?.week_count ?? 0, color: 'bg-blue-50 border-blue-200 text-blue-800' },
                        { key: 'pending',   label: 'Pendientes',  count: stats?.pending    ?? 0, color: 'bg-warm-gray text-text-light border-warm-gray-dark' },
                        { key: 'contacted', label: 'Contactados', count: stats?.contacted  ?? 0, color: 'bg-emerald-50 border-emerald-200 text-emerald-800' },
                        { key: 'discarded', label: 'Descartados', count: stats?.discarded  ?? 0, color: 'bg-warm-gray-dark/40 text-text-muted border-warm-gray-dark' },
                    ];
                    return `
                        <div class="flex gap-2 overflow-x-auto -mx-1 px-1 py-1 snap-x">
                            ${items.map(it => `
                                <button data-qf="${it.key}" class="shrink-0 snap-start inline-flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium border transition ${
                                    s.quick === it.key
                                        ? 'bg-brand text-white border-brand ring-2 ring-brand/30'
                                        : it.color + ' hover:border-brand/40'
                                }">
                                    <span>${it.label}</span>
                                    <span class="${s.quick === it.key ? 'bg-white/20 text-white' : 'bg-black/5 text-text'} rounded-full px-2 text-xs font-bold tabular-nums">${it.count}</span>
                                </button>
                            `).join('')}
                        </div>`;
                }

                function statusChip(c) {
                    if (c.overdue) {
                        const days = c.next_contact_date
                            ? Math.floor((Date.parse(todayISO()) - Date.parse(c.next_contact_date)) / 86400000)
                            : null;
                        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border border-red-300 bg-red-50 text-red-800 animate-pulse">⚠ Retrasado${days?' '+days+'d':''}</span>`;
                    }
                    if (c.due_today)
                        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border border-orange-300 bg-orange-50 text-orange-800">⏰ Llamar hoy</span>`;
                    if (c.status === 'scheduled')
                        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border border-blue-200 bg-blue-50 text-blue-800">📅 ${esc(c.next_contact_date || '')}</span>`;
                    if (c.status === 'contacted')
                        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border border-emerald-200 bg-emerald-50 text-emerald-800">✓ Contactado</span>`;
                    if (c.status === 'discarded')
                        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border border-warm-gray-dark bg-warm-gray text-text-muted">Descartado</span>`;
                    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border border-warm-gray-dark bg-warm-gray text-text-light">Pendiente</span>`;
                }

                function renderFilters() {
                    const cats = ['', 'ALUMINUM', 'COPPER/BRASS', 'SS/HITEMP/OTHER'];
                    return `
                        <div class="bg-white rounded-2xl border border-warm-gray-dark/50 p-3 flex flex-col sm:flex-row gap-2">
                            <input type="search" id="cli-q" value="${esc(s.search)}" placeholder="Buscar compañía, buyer o teléfono…"
                                class="flex-1 px-3 py-2 rounded-xl border border-warm-gray-dark/50 bg-white text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"/>
                            <select id="cli-cat" class="px-3 py-2 rounded-xl border border-warm-gray-dark/50 bg-white text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20">
                                ${cats.map(c => `<option value="${esc(c)}" ${c===s.category?'selected':''}>${c===''?'Todas las categorías':c}</option>`).join('')}
                            </select>
                        </div>`;
                }

                function renderClient(c) {
                    const isOpen = s.expanded === c.phone;
                    const phoneHref = c.phone ? `tel:${c.phone.replace(/[^\d+]/g,'')}` : '#';
                    const overdueCls = c.overdue ? 'border-red-300 ring-1 ring-red-100' : 'border-warm-gray-dark/40';
                    const notesBadge = c.notes_count > 0
                        ? `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-800 border border-amber-200" title="Tiene ${c.notes_count} nota${c.notes_count===1?'':'s'}">📝 ${c.notes_count}</span>`
                        : '';
                    return `
                        <div class="cli-card bg-white rounded-xl border overflow-hidden ${overdueCls}">
                            <div class="p-3 flex items-start gap-3">
                                <div class="w-10 h-10 rounded-full bg-brand/10 flex items-center justify-center shrink-0 text-brand font-bold text-sm">
                                    ${esc((c.company || '?').slice(0,2).toUpperCase())}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <div class="font-semibold text-text truncate" title="${esc(c.company)}">${esc(c.company || '— Sin compañía')}</div>
                                        ${statusChip(c)}
                                        ${notesBadge}
                                    </div>
                                    <div class="text-sm text-text-light truncate">${esc(c.buyer || '—')}</div>
                                    <div class="mt-1 flex flex-wrap gap-1 items-center">
                                        <a href="${esc(phoneHref)}" class="text-xs font-mono text-accent-dark hover:underline">${esc(c.phone || '—')}</a>
                                        <span class="text-text-muted text-xs">·</span>
                                        ${(c.categories || []).map(catChip).join(' ')}
                                    </div>
                                    <div class="text-[11px] text-text-muted mt-1">
                                        ${c.material_count} material${c.material_count===1?'':'es'} · ${c.row_count} cotización${c.row_count===1?'':'es'} ·
                                        última ${fmtFechaShort(c.last_seen)}
                                        ${c.last_contact_at ? ` · contacto ${fmtFechaShort(c.last_contact_at)}` : ''}
                                    </div>
                                </div>
                                <div class="shrink-0 flex flex-col gap-1">
                                    <button data-edit="${esc(c.phone)}" class="px-2 py-1 rounded-lg text-xs bg-brand/10 text-brand hover:bg-brand/20 transition font-medium">
                                        ✏ Editar
                                    </button>
                                    <button data-toggle="${esc(c.phone)}" class="px-2 py-1 rounded-lg text-xs bg-warm-gray hover:bg-warm-gray-dark/60 transition">
                                        ${isOpen ? '▲ Ocultar' : '▼ Historial'}
                                    </button>
                                </div>
                            </div>
                            ${isOpen ? `<div id="cli-detail-${esc(c.phone)}" class="border-t border-warm-gray-dark/30 bg-warm-gray/40">${loadingBox()}</div>` : ''}
                        </div>`;
                }

                // --------- Notas (API + localStorage fallback) ---------
                async function loadNotes(phone) {
                    const norm = phoneNorm(phone);
                    if (backendMode !== 'api') return loadNotesLocal(norm);
                    try {
                        const qs = new URLSearchParams({ action: 'peony_client_notes', phone: norm });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) return r.notes || [];
                        throw new Error(r?.error || 'api_fail');
                    } catch {
                        return loadNotesLocal(norm);
                    }
                }
                async function saveNote(phone, note) {
                    const norm = phoneNorm(phone);
                    if (backendMode !== 'api') return saveNoteLocal(norm, note);
                    try {
                        const r = await jsonPost(`${API}?action=peony_client_note_create`, { phone: norm, note });
                        if (r?.ok && r.note) return r.note;
                        throw new Error(r?.error || 'api_fail');
                    } catch (e) {
                        throw e;
                    }
                }
                function loadNotesLocal(phone) {
                    try { return JSON.parse(localStorage.getItem(LS_NOTES(phone))) || []; }
                    catch { return []; }
                }
                function saveNoteLocal(phone, note) {
                    const list = loadNotesLocal(phone);
                    const n = { id: Date.now(), note, author: null, created_at: new Date().toISOString(), _local: true };
                    list.unshift(n);
                    localStorage.setItem(LS_NOTES(phone), JSON.stringify(list));
                    return n;
                }

                // --------- Modal de edición de cliente ---------
                let _escHandler = null;
                function openClientModal(client, options = {}) {
                    s.modal = {
                        phone: client.phone, client,
                        notes: [], loading: true, error: null,
                        materialContext: options.materialContext || null,  // {material, price_raw, price_num, file_date}
                    };
                    renderModal();
                    _escHandler = (e) => { if (e.key === 'Escape') closeClientModal(); };
                    document.addEventListener('keydown', _escHandler);
                    loadNotes(client.phone).then(notes => {
                        if (!s.modal) return;
                        s.modal.notes = notes; s.modal.loading = false;
                        renderModal();
                    }).catch(e => {
                        if (!s.modal) return;
                        s.modal.error = e.message || 'Error cargando notas';
                        s.modal.loading = false;
                        renderModal();
                    });
                }
                function closeClientModal() {
                    s.modal = null;
                    document.getElementById('cli-modal')?.remove();
                    if (_escHandler) { document.removeEventListener('keydown', _escHandler); _escHandler = null; }
                    document.body.style.overflow = '';
                }
                function renderModal() {
                    let modal = document.getElementById('cli-modal');
                    if (!s.modal) { modal?.remove(); return; }
                    if (!modal) {
                        modal = document.createElement('div');
                        modal.id = 'cli-modal';
                        modal.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm';
                        modal.addEventListener('click', (e) => { if (e.target === modal) closeClientModal(); });
                        document.body.appendChild(modal);
                        document.body.style.overflow = 'hidden';
                    }
                    const m = s.modal, c = m.client;
                    const localBadge = backendMode !== 'api'
                        ? `<span class="text-[10px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-1.5 py-0.5 ml-2">notas locales</span>`
                        : '';
                    modal.innerHTML = `
                        <div class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl shadow-2xl max-h-[92vh] flex flex-col animate-[fade_0.15s_ease]">
                            <div class="flex items-start gap-3 p-4 border-b border-warm-gray-dark/30">
                                <div class="w-11 h-11 rounded-full bg-brand/10 flex items-center justify-center shrink-0 text-brand font-bold">
                                    ${esc((c.company || '?').slice(0,2).toUpperCase())}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-semibold text-text truncate">${esc(c.company || '—')}</div>
                                    <div class="text-sm text-text-light truncate">${esc(c.buyer || '—')}</div>
                                    <a href="tel:${esc((m.phone||'').replace(/[^\d+]/g,''))}" class="text-xs font-mono text-accent-dark">${esc(m.phone)}</a>
                                </div>
                                <button id="cli-modal-calc-top" class="shrink-0 w-9 h-9 rounded-full bg-brand/10 hover:bg-brand/20 flex items-center justify-center text-brand" aria-label="Calculadora" title="Abrir calculadora con este contacto">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m-6 4h6m-6 4h4M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>
                                    </svg>
                                </button>
                                <button id="cli-modal-close" class="shrink-0 w-9 h-9 rounded-full bg-warm-gray hover:bg-warm-gray-dark/60 flex items-center justify-center text-text-light" aria-label="Cerrar">✕</button>
                            </div>
                            <div class="flex-1 overflow-y-auto p-4 space-y-5">
                                <!-- Estado del contacto -->
                                <div>
                                    <div class="text-xs uppercase tracking-wide text-text-muted mb-2">Estado del contacto</div>
                                    <div class="grid grid-cols-2 gap-2 mb-2">
                                        ${[
                                            { v:'pending',   l:'Pendiente',   cls:'border-warm-gray-dark bg-warm-gray text-text-light' },
                                            { v:'scheduled', l:'Programar 📅',cls:'border-blue-200 bg-blue-50 text-blue-800' },
                                            { v:'contacted', l:'Contactado ✓',cls:'border-emerald-200 bg-emerald-50 text-emerald-800' },
                                            { v:'discarded', l:'Descartar',   cls:'border-warm-gray-dark bg-warm-gray-dark/30 text-text-muted' },
                                        ].map(o => `
                                            <button data-status="${o.v}" class="px-3 py-2 rounded-xl text-sm font-medium border transition ${
                                                (c.status || 'pending') === o.v
                                                    ? 'bg-brand text-white border-brand'
                                                    : o.cls + ' hover:border-brand/40'
                                            }">${o.l}</button>
                                        `).join('')}
                                    </div>
                                    <div id="cli-modal-dateblock" class="${(c.status || 'pending') === 'scheduled' ? '' : 'hidden'}">
                                        <label class="block">
                                            <span class="block text-[11px] uppercase tracking-wide text-text-muted mb-1">Próximo contacto</span>
                                            <input id="cli-modal-date" type="date" value="${esc(c.next_contact_date || '')}" min="${esc(todayISO())}"
                                                class="w-full px-3 py-2 rounded-xl border border-warm-gray-dark/50 bg-white text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"/>
                                        </label>
                                    </div>
                                    ${c.last_contact_at ? `<div class="text-[11px] text-text-muted mt-2">Último contacto: ${esc(fmtFechaShort(c.last_contact_at))}</div>` : ''}
                                    <div class="mt-2">
                                        <button id="cli-modal-now" class="w-full px-3 py-2 rounded-xl text-sm bg-emerald-600 text-white hover:bg-emerald-700 font-semibold">
                                            ☎ Marcar contactado ahora
                                        </button>
                                    </div>
                                </div>

                                <!-- Notas de conversación -->
                                <div>
                                <div class="flex items-center mb-3">
                                    <div class="text-xs uppercase tracking-wide text-text-muted">Notas de conversación</div>
                                    ${localBadge}
                                </div>
                                ${m.loading ? loadingBox() : m.error ? errorBox(m.error) : (m.notes.length === 0
                                    ? emptyBox('Sin notas registradas aún. Añade la primera abajo.')
                                    : `<div class="space-y-2">
                                        ${m.notes.map(n => `
                                            <div class="bg-warm-gray/40 rounded-lg p-3 border border-warm-gray-dark/30">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <div class="text-xs font-semibold text-text-light">${esc(fmtFechaShort(n.created_at))}</div>
                                                    ${n.author ? `<div class="text-[10px] text-text-muted">· ${esc(n.author)}</div>` : ''}
                                                    ${n._local ? `<span class="text-[9px] text-amber-700">(local)</span>` : ''}
                                                </div>
                                                <div class="text-sm text-text whitespace-pre-wrap break-words">${esc(n.note)}</div>
                                            </div>
                                        `).join('')}
                                    </div>`)}
                                </div>
                            </div>
                            <div class="p-4 border-t border-warm-gray-dark/30 bg-warm-gray/20 space-y-2">
                                ${m.materialContext ? `
                                    <div class="bg-accent/5 border border-accent/30 rounded-xl p-2 flex items-center gap-2 text-xs">
                                        <span class="text-accent-dark font-semibold shrink-0">Material:</span>
                                        <span class="truncate flex-1" title="${esc(m.materialContext.material)}">${esc(m.materialContext.material)}</span>
                                        ${m.materialContext.price_raw ? `<span class="font-mono font-bold text-brand-dark">${esc(m.materialContext.price_raw)}</span>` : ''}
                                    </div>
                                ` : ''}
                                <textarea id="cli-modal-note" rows="3" placeholder="Nueva nota de conversación…" maxlength="4000"
                                    class="w-full px-3 py-2 rounded-xl border border-warm-gray-dark/50 bg-white text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 resize-none"></textarea>
                                <div class="flex gap-2 flex-wrap justify-between">
                                    <button id="cli-modal-calc" class="px-3 py-2 rounded-xl text-sm bg-accent/10 text-accent-dark border border-accent/30 hover:bg-accent/20 font-medium">
                                        💼 Calculadora
                                    </button>
                                    <div class="flex gap-2">
                                        <button id="cli-modal-cancel" class="px-4 py-2 rounded-xl text-sm bg-white border border-warm-gray-dark/50 hover:bg-warm-gray">Cancelar</button>
                                        <button id="cli-modal-save" class="px-4 py-2 rounded-xl text-sm bg-brand text-white font-semibold hover:bg-brand-dark disabled:opacity-50">Guardar nota</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    modal.querySelector('#cli-modal-close').addEventListener('click', closeClientModal);
                    modal.querySelector('#cli-modal-cancel').addEventListener('click', closeClientModal);
                    modal.querySelector('#cli-modal-calc-top')?.addEventListener('click', () => {
                        const ctx = {
                            phone: m.phone, company: c.company || null, buyer: c.buyer || null,
                            material: m.materialContext?.material || null,
                            price_raw: m.materialContext?.price_raw || null,
                            price_num: m.materialContext?.price_num ?? null,
                            file_date: m.materialContext?.file_date || null,
                        };
                        window.valkamsync?.openCalculator?.(ctx);
                    });
                    modal.querySelector('#cli-modal-calc')?.addEventListener('click', () => {
                        const ctx = {
                            phone:    m.phone,
                            company:  c.company || null,
                            buyer:    c.buyer || null,
                            material: m.materialContext?.material   || null,
                            price_raw:m.materialContext?.price_raw || null,
                            price_num:m.materialContext?.price_num ?? null,
                            file_date:m.materialContext?.file_date || null,
                            added_at: new Date().toISOString(),
                        };
                        // Guarda contexto y abre el modal global (apilado sobre el de cliente, z-[60])
                        localStorage.setItem('valkamsync.calculator.context', JSON.stringify(ctx));
                        if (window.valkamsync?.openCalculator) {
                            window.valkamsync.openCalculator(ctx);
                        } else {
                            closeClientModal();
                            location.hash = '#/precios/calculadora';
                        }
                    });
                    modal.querySelector('#cli-modal-save').addEventListener('click', async () => {
                        const ta = modal.querySelector('#cli-modal-note');
                        const val = ta.value.trim();
                        if (!val) { ta.focus(); return; }
                        const btn = modal.querySelector('#cli-modal-save');
                        btn.disabled = true; btn.textContent = 'Guardando…';
                        try {
                            const saved = await saveNote(m.phone, val);
                            if (s.modal) {
                                s.modal.notes.unshift(saved);
                                renderModal();
                                modal.querySelector('#cli-modal-note').focus();
                            }
                        } catch (e) {
                            alert('No se pudo guardar: ' + (e.message || e));
                            btn.disabled = false; btn.textContent = 'Guardar nota';
                        }
                    });
                    // Estado: radios
                    modal.querySelectorAll('[data-status]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const next = btn.dataset.status;
                            const dateBlock = modal.querySelector('#cli-modal-dateblock');
                            if (next === 'scheduled') {
                                dateBlock.classList.remove('hidden');
                                const date = modal.querySelector('#cli-modal-date').value || todayISO();
                                try {
                                    const updated = await saveClientStatus(m.phone, { status: 'scheduled', next_contact_date: date });
                                    Object.assign(m.client, updateClientFromStatus(m.client, updated));
                                    renderModal();
                                    refreshList();
                                } catch (e) { alert('No se pudo guardar estado: ' + (e.message||e)); }
                            } else {
                                dateBlock.classList.add('hidden');
                                try {
                                    const updated = await saveClientStatus(m.phone, { status: next });
                                    Object.assign(m.client, updateClientFromStatus(m.client, updated));
                                    renderModal();
                                    refreshList();
                                } catch (e) { alert('No se pudo guardar estado: ' + (e.message||e)); }
                            }
                        });
                    });
                    // Fecha de contacto programado
                    modal.querySelector('#cli-modal-date')?.addEventListener('change', async (e) => {
                        try {
                            const updated = await saveClientStatus(m.phone, { status: 'scheduled', next_contact_date: e.target.value });
                            Object.assign(m.client, updateClientFromStatus(m.client, updated));
                            renderModal();
                            refreshList();
                        } catch (err) { alert('No se pudo guardar fecha: ' + (err.message||err)); }
                    });
                    // Marcar contactado ahora
                    modal.querySelector('#cli-modal-now')?.addEventListener('click', async () => {
                        try {
                            const updated = await saveClientStatus(m.phone, { status: 'contacted', mark_contacted_now: true });
                            Object.assign(m.client, updateClientFromStatus(m.client, updated));
                            renderModal();
                            refreshList();
                        } catch (e) { alert('No se pudo marcar: ' + (e.message||e)); }
                    });

                    setTimeout(() => modal.querySelector('#cli-modal-note')?.focus(), 50);
                }

                function updateClientFromStatus(client, status) {
                    const today = todayISO();
                    return {
                        status: status.status,
                        next_contact_date: status.next_contact_date,
                        last_contact_at: status.last_contact_at,
                        overdue:   status.status === 'scheduled' && status.next_contact_date && status.next_contact_date < today,
                        due_today: status.status === 'scheduled' && status.next_contact_date === today,
                    };
                }

                function renderDetail(d) {
                    if (!d.rows?.length) return `<div class="p-4 text-sm text-text-muted">Sin filas.</div>`;

                    // Agrupa por material
                    const byMat = new Map();
                    for (const r of d.rows) {
                        const num = r.price_num != null ? Number(r.price_num) : parseFloat(r.price_raw);
                        if (!byMat.has(r.material)) {
                            byMat.set(r.material, { material: r.material, category: r.category, prices: [] });
                        }
                        byMat.get(r.material).prices.push({
                            date: r.file_date, price_raw: r.price_raw,
                            price_num: isFinite(num) ? num : null,
                            delivery_basis: r.delivery_basis,
                        });
                    }

                    const materials = [...byMat.values()].map(m => {
                        const nums = m.prices.map(p => p.price_num).filter(n => n != null && isFinite(n));
                        const sortedDate = [...m.prices].sort((a,b) => b.date.localeCompare(a.date));
                        return {
                            ...m,
                            count: m.prices.length,
                            latest: sortedDate[0],
                            min: nums.length ? Math.min(...nums) : null,
                            max: nums.length ? Math.max(...nums) : null,
                        };
                    });

                    const dir = s.historySort.dir === 'asc' ? 1 : -1;
                    const col = s.historySort.col;
                    materials.sort((a, b) => {
                        const pick = (o) => {
                            if (col === 'material') return o.material || '';
                            if (col === 'date')     return o.latest?.date || '';
                            if (col === 'latest')   return o.latest?.price_num ?? -Infinity;
                            if (col === 'min')      return o.min ?? -Infinity;
                            if (col === 'max')      return o.max ?? -Infinity;
                            return 0;
                        };
                        const va = pick(a), vb = pick(b);
                        if (typeof va === 'string') return dir * va.localeCompare(vb);
                        return dir * (va - vb);
                    });

                    const arrow = (c) => col === c ? (s.historySort.dir === 'asc' ? '▲' : '▼') : '↕';
                    const header = (c, label, align = 'left') => `
                        <button data-sort="${c}" class="flex items-center gap-1 px-2 py-1.5 text-[11px] uppercase tracking-wide ${col === c ? 'text-brand font-bold bg-brand/5' : 'text-text-muted hover:text-brand'} ${align==='right'?'justify-end':''}">
                            <span>${label}</span><span class="text-[9px]">${arrow(c)}</span>
                        </button>`;

                    return `
                        <div class="p-1">
                            <div class="grid grid-cols-[2fr_1fr_1fr_0.8fr_0.8fr] gap-0.5 border-b border-warm-gray-dark/30 sticky top-0 bg-warm-gray/60 backdrop-blur-sm z-10">

                            </div>
                            <div class="max-h-96 overflow-y-auto">
                                ${materials.map(m => `
                                    <div class="grid grid-cols-[2fr_1fr_1fr_0.8fr_0.8fr] gap-0.5 px-2 py-1.5 text-xs hover:bg-white rounded items-center border-b border-warm-gray-dark/10">
                                        <div class="min-w-0">

                async function refreshList() {
                    const box = $('#cli-list');
                    if (!box) return;
                    box.innerHTML = loadingBox();
                    try {
                        const data = await loadClients();
                        _lastClients = data.clients || [];
                        // Stats para los quick filters (API → fallback derivado)
                        const statsRes = await loadStats();
                        _lastStats = statsRes?.stats || null;
                        const quickEl = $('#cli-quick');
                        if (quickEl) quickEl.innerHTML = renderQuickFilters(_lastStats);
                        $('#cli-header').outerHTML = `<div id="cli-header">${renderHeader(data)}</div>`;
                        if (!data.clients.length) {
                            box.innerHTML = emptyBox(s.quick === 'all'
                                ? 'No hay clientes para los filtros aplicados.'
                                : `Sin clientes en "${quickLabel(s.quick)}".`);
                            bindRowHandlers();
                            return;
                        }
                        const showing = Math.min(data.offset + data.clients.length, data.total);
                        const pager = `
                            <div id="cli-pager" class="flex items-center justify-between gap-3 pt-2">
                                <div class="text-xs text-text-muted">${data.offset + 1}–${showing} de ${data.total}</div>
                                <div class="flex gap-2">
                                    <button id="cli-prev" ${s.offset===0?'disabled':''} class="px-3 py-1.5 rounded-lg text-sm bg-white border border-warm-gray-dark/50 disabled:opacity-40">← Anterior</button>
                                    <button id="cli-next" ${showing>=data.total?'disabled':''} class="px-3 py-1.5 rounded-lg text-sm bg-white border border-warm-gray-dark/50 disabled:opacity-40">Siguiente →</button>
                                </div>
                            </div>`;
                        box.innerHTML = data.clients.map(renderClient).join('') + pager;
                        bindRowHandlers();
                        if (s.expanded) await expandDetail(s.expanded);
                    } catch (e) {
                        box.innerHTML = errorBox(e.message || String(e));
                    }
                }

                async function expandDetail(phone) {
                    const pane = document.getElementById('cli-detail-' + phone);
                    if (!pane) return;
                    try {
                        const d = await loadClientDetail(phone);
                        pane.innerHTML = renderDetail(d);
                    } catch (e) {
                        pane.innerHTML = errorBox(e.message || String(e));
                    }
                }

                function bindRowHandlers() {
                    document.querySelectorAll('[data-toggle]').forEach(b => {
                        b.addEventListener('click', async () => {
                            const phone = b.dataset.toggle;
                            s.expanded = (s.expanded === phone) ? null : phone;
                            await refreshList();
                        });
                    });
                    document.querySelectorAll('[data-edit]').forEach(b => {
                        b.addEventListener('click', async () => {
                            const phone = b.dataset.edit;
                            // Buscamos el cliente completo en la última lista renderizada
                            const client = _lastClients.find(c => c.phone === phone);
                            if (!client) return;
                            openClientModal(client);
                        });
                    });
                    // Sort headers dentro del panel de historial (delegation: existen tras expandir)
                    document.querySelectorAll('[data-sort]').forEach(b => {
                        b.addEventListener('click', async () => {
                            const col = b.dataset.sort;
                            if (s.historySort.col === col) {
                                s.historySort.dir = s.historySort.dir === 'asc' ? 'desc' : 'asc';
                            } else {
                                s.historySort.col = col;
                                s.historySort.dir = 'desc';
                            }
                            if (s.expanded) await expandDetail(s.expanded);
                        });
                    });
                    $('#cli-prev')?.addEventListener('click', () => { s.offset = Math.max(0, s.offset - s.limit); refreshList(); });
                    $('#cli-next')?.addEventListener('click', () => { s.offset += s.limit; refreshList(); });

                    // Quick filters
                    document.querySelectorAll('[data-qf]').forEach(b => {
                        b.addEventListener('click', () => {
                            s.quick = b.dataset.qf;
                            s.offset = 0;
                            s.expanded = null;
                            refreshList();
                        });
                    });
                    // Imprimir / Exportar PDF (usa el diálogo de impresión del navegador)
                    $('#cli-print')?.addEventListener('click', () => { window.print(); });
                    // Compartir (nativo en mobile; fallback copy-to-clipboard)
                    $('#cli-share')?.addEventListener('click', async () => {
                        const list = _lastClients.map(c => `${c.company || '—'} · ${c.buyer || '—'} · ${c.phone || '—'}${c.notes_count?' · 📝'+c.notes_count:''}${c.overdue?' · ⚠RETRASADO':''}`).join('\n');
                        const txt = `ValkamSync · ${quickLabel(s.quick)}\n${new Date().toLocaleString('es')}\n\n${list}`;
                        if (navigator.share) {
                            try { await navigator.share({ title: 'Listado de clientes', text: txt }); } catch {}
                        } else {
                            try { await navigator.clipboard.writeText(txt); alert('Copiado al portapapeles.'); }
                            catch { alert('Tu navegador no soporta compartir ni copiar al portapapeles.'); }
                        }
                    });
                }

                function bindFilters() {
                    let t;
                    $('#cli-q')?.addEventListener('input', e => {
                        clearTimeout(t);
                        t = setTimeout(() => { s.search = e.target.value; s.offset = 0; s.expanded = null; refreshList(); }, 300);
                    });
                    $('#cli-cat')?.addEventListener('change', e => { s.category = e.target.value; s.offset = 0; s.expanded = null; refreshList(); });
                }

                // Exponer el modal para que otras vistas (Precios) lo invoquen
                window.valkamsync = window.valkamsync || {};
                window.valkamsync.openClientModal = openClientModal;

                async function init() {
                    const root = $('#cli-root');
                    if (!root) return;
                    root.innerHTML = `
                        <div id="cli-header">${loadingBox()}</div>
                        <div id="cli-quick"></div>
                        <div id="cli-filters">${renderFilters()}</div>
                        <div id="cli-list">${loadingBox()}</div>
                    `;
                    bindFilters();
                    await refreshList();
                }

                return {
                    title: 'Listado de Clientes',
                    back: '/clientes',
                    render: () => `<div id="cli-root" class="view space-y-4"></div>`,
                    init,
                };
            })(),
            '/precios/analizar': (() => {
                // =====================================================================
                // Vista "Analizar Archivos PeonyInc" — módulo self-contained
                // Consume api.php?action=peony_* (prod) con fallback al JSON bootstrap.
                // =====================================================================
                const API = 'api.php';
                const BOOTSTRAP_URL = '../tmp/peony_prices.json';

                const s = {
                    tab: 'prices',        // 'prices' | 'trends' | 'files'
                    filter: 'month',      // 'day' | 'week' | 'month' | 'all'
                    date: '',
                    category: '',
                    search: '',
                    offset: 0,
                    limit: 50,
                };
                let dashboard = null;
                let backendMode = 'unknown';   // 'api' | 'json' | 'error'
                let _bootstrap = null;

                const esc = v => v == null ? '' : String(v)
                    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
                    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
                const $ = (sel, ctx = document) => ctx.querySelector(sel);
                const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
                const fmtFechaES = iso => {
                    if (!iso) return '—';
                    const d = new Date(iso.replace(' ', 'T') + (iso.endsWith('Z') ? '' : ''));
                    if (isNaN(d)) return iso;
                    const h = d.getHours(), ampm = h >= 12 ? 'PM' : 'AM', h12 = h % 12 === 0 ? 12 : h % 12;
                    return `${d.getDate()} de ${meses[d.getMonth()]}, ${d.getFullYear()} - ${h12}:${String(d.getMinutes()).padStart(2,'0')} ${ampm}`;
                };

                async function jsonGet(url) {
                    const r = await fetch(url, { credentials: 'same-origin' });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }
                async function jsonPost(url, body) {
                    const r = await fetch(url, { method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }

                async function getBootstrap() {
                    if (_bootstrap) return _bootstrap;
                    // Primero: tag <script> embebido (funciona bajo file:// sin CORS)
                    const embed = document.getElementById('peony-bootstrap-data');
                    if (embed && embed.textContent.trim()) {
                        try { _bootstrap = JSON.parse(embed.textContent); return _bootstrap; }
                        catch (e) { console.warn('[bootstrap] JSON embed inválido, caigo a fetch', e); }
                    }
                    // Fallback: fetch (falla bajo file:// por CORS — requiere servir con HTTP)
                    try {
                        _bootstrap = await jsonGet(BOOTSTRAP_URL);
                        return _bootstrap;
                    } catch (e) {
                        throw new Error('No se pudo cargar el dataset bootstrap. ' +
                            (location.protocol === 'file:'
                                ? 'Abre la app servida por HTTP (ej. php -S localhost:8080 -t deploy) o recarga tras asegurarte que el JSON embebido esté presente.'
                                : 'Verifica ' + BOOTSTRAP_URL));
                    }
                }

                // --------- Endpoint wrappers (API real con fallback JSON) ---------
                async function loadDashboard() {
                    if (backendMode === 'json') return dashboardFromBootstrap();
                    try {
                        const d = await jsonGet(`${API}?action=peony_dashboard`);
                        if (d?.ok) { backendMode = 'api'; return d; }
                        throw new Error('api_not_ok');
                    } catch {
                        backendMode = 'json';
                        return dashboardFromBootstrap();
                    }
                }
                async function dashboardFromBootstrap() {
                    const d = await getBootstrap();
                    const dates = [...new Set(d.rows.map(r => r.date))].sort();
                    return {
                        ok: true,
                        mode: 'bootstrap-json',
                        last_sync: {
                            fecha: d.generated_at,
                            fecha_es: fmtFechaES(d.generated_at),
                            file_count: dates.length,
                            row_count: d.rows.length,
                        },
                        counts: {
                            files_total: dates.length,
                            files_pending: dates.length,
                            files_validated: 0,
                            files_synced: 0,
                            prices_total: d.rows.length,
                            date_min: dates[0] ?? null,
                            date_max: dates[dates.length - 1] ?? null,
                        }
                    };
                }

                async function loadPrices() {
                    if (backendMode === 'json') return pricesFromBootstrap();
                    try {
                        const qs = new URLSearchParams({
                            action: 'peony_prices',
                            filter: s.filter, date: s.date, category: s.category,
                            q: s.search, offset: s.offset, limit: s.limit,
                        });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) return r;
                        throw new Error();
                    } catch {
                        return pricesFromBootstrap();
                    }
                }
                function matchFilter(rowDate) {
                    if (s.filter === 'all') return true;
                    const ref = s.date || dashboard?.counts?.date_max || new Date().toISOString().slice(0,10);
                    if (s.filter === 'day')   return rowDate === ref;
                    if (s.filter === 'month') return rowDate.slice(0,7) === ref.slice(0,7);
                    if (s.filter === 'week') {
                        const d = new Date(ref), day = (d.getDay()+6)%7; // Mon=0
                        const mon = new Date(d); mon.setDate(d.getDate()-day);
                        const sun = new Date(mon); sun.setDate(mon.getDate()+6);
                        return rowDate >= mon.toISOString().slice(0,10) && rowDate <= sun.toISOString().slice(0,10);
                    }
                    return true;
                }
                async function pricesFromBootstrap() {
                    const d = await getBootstrap();
                    let rows = d.rows.filter(r => matchFilter(r.date));
                    if (s.category) rows = rows.filter(r => r.category === s.category);
                    if (s.search)   {
                        const q = s.search.toLowerCase();
                        rows = rows.filter(r => (r.material+' '+r.company+' '+r.buyer).toLowerCase().includes(q));
                    }
                    rows.sort((a,b) => b.date.localeCompare(a.date) || a.category.localeCompare(b.category));
                    const total = rows.length;
                    const slice = rows.slice(s.offset, s.offset + s.limit).map(r => ({
                        id: null, file_id: null, file_date: r.date, category: r.category,
                        material: r.material, price_raw: r.price_raw,
                        price_num: parseFloat(r.price_raw) || null, price_unit: null,
                        delivery_basis: r.delivery_basis, company: r.company,
                        buyer: r.buyer, phone: r.phone, row_status: 'ok',
                    }));
                    return { ok: true, total, limit: s.limit, offset: s.offset, prices: slice };
                }

                async function loadTrends() {
                    if (backendMode === 'json') return trendsFromBootstrap();
                    try {
                        const qs = new URLSearchParams({ action: 'peony_compare', window: 14, category: s.category, limit: 60 });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) return r;
                        throw new Error();
                    } catch {
                        return trendsFromBootstrap();
                    }
                }
                async function trendsFromBootstrap() {
                    const d = await getBootstrap();
                    const byMat = new Map();
                    for (const r of d.rows) {
                        const n = parseFloat(r.price_raw);
                        if (!isFinite(n)) continue;
                        if (!byMat.has(r.material)) byMat.set(r.material, []);
                        byMat.get(r.material).push({...r, price_num: n});
                    }
                    const rows = [];
                    for (const [material, arr] of byMat) {
                        arr.sort((a,b) => b.date.localeCompare(a.date));
                        const latest = arr[0];
                        const prev = arr.slice(1, 15);
                        const avg = prev.length ? prev.reduce((s,x) => s+x.price_num, 0)/prev.length : null;
                        const delta = avg ? (latest.price_num - avg) / avg : null;
                        if (s.category && latest.category !== s.category) continue;
                        rows.push({
                            material, category: latest.category,
                            price_current: latest.price_num, date_current: latest.date,
                            avg_prev: avg, n_prev: prev.length,
                            delta_pct: delta == null ? null : +(delta*100).toFixed(2),
                            trend: delta == null ? 'flat' : (delta > 0.02 ? 'up' : (delta < -0.02 ? 'down' : 'flat')),
                            company: latest.company, buyer: latest.buyer, phone: latest.phone,
                        });
                    }
                    rows.sort((a,b) => Math.abs(b.delta_pct ?? 0) - Math.abs(a.delta_pct ?? 0));
                    return { ok: true, window_days: 14, rows: rows.slice(0, 60) };
                }

                async function loadFiles() {
                    if (backendMode === 'json') return filesFromBootstrap();
                    try {
                        const qs = new URLSearchParams({ action: 'peony_files', filter: s.filter, date: s.date, limit: 200 });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) return r;
                        throw new Error();
                    } catch {
                        return filesFromBootstrap();
                    }
                }
                async function filesFromBootstrap() {
                    const d = await getBootstrap();
                    const byDate = new Map();
                    for (const r of d.rows) byDate.set(r.date, (byDate.get(r.date)||0)+1);
                    const files = [...byDate.entries()]
                        .filter(([date]) => matchFilter(date))
                        .sort((a,b) => b[0].localeCompare(a[0]))
                        .map(([date, n], i) => ({
                            id: i+1,
                            filename: date.replaceAll('-','') + 'CBE.pdf',
                            file_date: date, row_count: n,
                            parser_version: 'bootstrap-1.0', sync_status: 'pending',
                            imported_at: d.generated_at, synced_at: null,
                            size: null,
                        }));
                    return { ok: true, files, filter: s.filter, date: s.date };
                }

                // --------- Renderers ---------

                            <div class="inline-block w-8 h-8 border-4 border-warm-gray-dark border-t-brand rounded-full animate-spin"></div>
                            <div class="mt-3 text-text-light text-sm">Cargando…</div>
                        </div>`;
                }
                function emptyBox(msg) {

                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M4.93 19h14.14c1.54 0 2.5-1.67 1.73-3L13.73 4a2 2 0 00-3.46 0L3.2 16c-.77 1.33.19 3 1.73 3z"/>

                }

                function renderSyncCard() {
                    const ls = dashboard?.last_sync;

                        ? `<div class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1 inline-block mt-2">

                    return `

                                    <input type="date" id="peony-date" value="${esc(s.date || dashboard?.counts?.date_max || '')}" max="${esc(dashboard?.counts?.date_max || '')}"
                                        class="w-full px-3 py-2 rounded-xl border border-warm-gray-dark/50 bg-white text-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"/>

                                </label>
                            </div>

                }

                function syncChip(status) {
                    const map = {
                        pending:   ['Pendiente','bg-amber-100 text-amber-800 border-amber-200'],
                        validated: ['Validado','bg-blue-100 text-blue-800 border-blue-200'],
                        synced:    ['Sincronizado','bg-emerald-100 text-emerald-800 border-emerald-200'],
                        error:     ['Error','bg-red-100 text-red-800 border-red-200'],
                    };
                    const [label, cls] = map[status] || ['?','bg-warm-gray text-text-muted border-warm-gray-dark'];
                    return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border ${cls}">${label}</span>`;

                function renderPricesTable(data) {

                // --------- Materiales (reemplaza el viejo listado de precios) ---------
                async function loadMaterials() {
                    if (backendMode === 'json') return materialsFromBootstrap();
                    try {
                        const qs = new URLSearchParams({
                            action: 'peony_materials',
                            filter: s.filter, date: s.date, category: s.category,
                            q: s.search, sort: s.matSort || 'latest',
                            offset: s.offset, limit: s.limit,
                        });
                        const r = await jsonGet(`${API}?${qs}`);
                        if (r?.ok) return r;
                        throw new Error();
                    } catch { return materialsFromBootstrap(); }
                }
                async function materialsFromBootstrap() {
                    const d = await getBootstrap();
                    const filtered = d.rows.filter(r =>
                        matchFilter(r.date) &&
                        (!s.category || r.category === s.category) &&
                        (!s.search   || r.material.toLowerCase().includes(s.search.toLowerCase()))
                    );
                    const byMat = new Map();
                    for (const r of filtered) {
                        const n = parseFloat(r.price_raw);
                        if (!byMat.has(r.material)) byMat.set(r.material, {
                            material: r.material, category: r.category, contacts: new Set(),
                            prices: [], nums: [],
                        });
                        const m = byMat.get(r.material);
                        if (r.phone) m.contacts.add(r.phone);
                        m.prices.push({ date: r.date, raw: r.price_raw, num: isFinite(n) ? n : null });
                        if (isFinite(n)) m.nums.push(n);
                    }
                    let list = [...byMat.values()].map(m => {
                        const sorted = m.prices.slice().sort((a,b) => b.date.localeCompare(a.date));
                        return {
                            material: m.material, category: m.category,
                            price_count: m.prices.length,
                            contact_count: m.contacts.size,
                            min_price: m.nums.length ? Math.min(...m.nums) : null,
                            max_price: m.nums.length ? Math.max(...m.nums) : null,
                            avg_price: m.nums.length ? m.nums.reduce((s,x)=>s+x,0)/m.nums.length : null,
                            latest_date: sorted[0]?.date,
                            latest_price_raw: sorted[0]?.raw,
                            latest_price_num: sorted[0]?.num,
                        };
                    });
                    const sort = s.matSort || 'latest';
                    list.sort((a,b) => {
                        if (sort === 'price_desc') return (b.latest_price_num ?? -Infinity) - (a.latest_price_num ?? -Infinity);
                        if (sort === 'price_asc')  return (a.latest_price_num ??  Infinity) - (b.latest_price_num ??  Infinity);
                        if (sort === 'contacts')   return b.contact_count - a.contact_count;
                        return (b.latest_date || '').localeCompare(a.latest_date || '') || a.material.localeCompare(b.material);
                    });
                    return {
                        ok: true, total: list.length, limit: s.limit, offset: s.offset,
                        sort, materials: list.slice(s.offset, s.offset + s.limit),
                    };
                }

                async function loadMaterialDetail(material) {
                    if (backendMode === 'api') {
                        try {
                            const r = await jsonGet(`${API}?action=peony_material_detail&material=${encodeURIComponent(material)}`);
                            if (r?.ok) return r;
                        } catch {}
                    }
                    return materialDetailFromBootstrap(material);
                }
                async function materialDetailFromBootstrap(material) {
                    const d = await getBootstrap();
                    const rows = d.rows.filter(r => r.material === material);
                    if (!rows.length) return { ok: false, error: 'not_found' };
                    const nums = rows.map(r => parseFloat(r.price_raw)).filter(n => isFinite(n));
                    const dates = [...new Set(rows.map(r => r.date))].sort();
                    const byDate = new Map();
                    for (const r of rows) {
                        const n = parseFloat(r.price_raw);
                        if (!byDate.has(r.date)) byDate.set(r.date, { nums: [], cnt: 0 });
                        const x = byDate.get(r.date);
                        if (isFinite(n)) x.nums.push(n);
                        x.cnt++;
                    }
                    const timeline = [...byDate.entries()].sort((a,b) => b[0].localeCompare(a[0])).slice(0, 60).map(([date, v]) => ({
                        file_date: date,
                        avg_price: v.nums.length ? v.nums.reduce((s,x)=>s+x,0)/v.nums.length : null,
                        min_price: v.nums.length ? Math.min(...v.nums) : null,
                        max_price: v.nums.length ? Math.max(...v.nums) : null,
                        cnt: v.cnt,
                    }));
                    return {
                        ok: true,
                        stats: {
                            material, category: rows[0].category,
                            price_count: rows.length,
                            contact_count: new Set(rows.map(r => r.phone).filter(Boolean)).size,
                            min_price: nums.length ? Math.min(...nums) : null,
                            max_price: nums.length ? Math.max(...nums) : null,
                            avg_price: nums.length ? nums.reduce((s,x)=>s+x,0)/nums.length : null,
                            first_date: dates[0], latest_date: dates[dates.length - 1],
                        },
                        timeline,
                    };
                }

                async function loadMaterialContacts(material, sort) {
                    if (backendMode === 'api') {
                        try {
                            const qs = new URLSearchParams({ action: 'peony_material_contacts', material, sort: sort || 'best', recent_days: 14 });
                            const r = await jsonGet(`${API}?${qs}`);
                            if (r?.ok) return r;
                        } catch {}
                    }
                    return materialContactsFromBootstrap(material, sort || 'best');
                }
                async function materialContactsFromBootstrap(material, sort) {
                    const d = await getBootstrap();
                    const rows = d.rows.filter(r => r.material === material);
                    // Agrupa por teléfono NORMALIZADO para unificar formatos variantes del mismo contacto
                    const phoneN = p => {
                        const s = String(p ?? '').trim();
                        if (!s) return '';
                        return (s.startsWith('+') ? '+' : '') + s.replace(/\D+/g, '');
                    };
                    const byPhone = new Map();
                    for (const r of rows) {
                        const norm = phoneN(r.phone);
                        if (!norm) continue;
                        const cur = byPhone.get(norm);
                        if (!cur || r.date > cur.latest_date) {
                            byPhone.set(norm, {
                                phone: r.phone,                    // display: formato más reciente
                                phone_norm: norm,                  // key canónico
                                company: r.company, buyer: r.buyer,
                                price_raw: r.price_raw, price_num: parseFloat(r.price_raw) || null,
                                latest_date: r.date, delivery_basis: r.delivery_basis,
                                quote_count: 0, notes_count: 0,
                            });
                        }
                    }
                    for (const r of rows) {
                        const norm = phoneN(r.phone);
                        if (norm && byPhone.has(norm)) byPhone.get(norm).quote_count++;
                    }
                    const today = new Date().toISOString().slice(0,10);
                    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 14);
                    const cutoffStr = cutoff.toISOString().slice(0,10);
                    const list = [...byPhone.values()].map(c => ({ ...c, is_recent: c.latest_date >= cutoffStr }));
                    list.sort((a,b) => {
                        const na = a.price_num ?? -Infinity, nb = b.price_num ?? -Infinity;
                        const da = a.latest_date || '', db = b.latest_date || '';
                        if (sort === 'recent') return db.localeCompare(da) || (nb - na);
                        if (sort === 'cheap')  {
                            if (a.is_recent !== b.is_recent) return a.is_recent ? -1 : 1;
                            return (na - nb) || db.localeCompare(da);
                        }
                        if (a.is_recent !== b.is_recent) return a.is_recent ? -1 : 1;
                        return (nb - na) || db.localeCompare(da);
                    });
                    return { ok: true, material, sort, recent_days: 14, cutoff: cutoffStr, contacts: list };
                }

                function renderMaterialsList(data) {

                    }).join('');

                    const showing = Math.min(data.offset + data.materials.length, data.total);
                    const pager = `
                        <div id="peony-pager" class="flex items-center justify-between gap-3 pt-2">
                            <div class="text-xs text-text-muted">${data.offset + 1}–${showing} de ${data.total}</div>
                            <div class="flex gap-2">
                                <button id="peony-prev" ${s.offset===0?'disabled':''} class="px-3 py-1.5 rounded-lg text-sm bg-white border border-warm-gray-dark/50 disabled:opacity-40">←</button>
                                <button id="peony-next" ${showing>=data.total?'disabled':''} class="px-3 py-1.5 rounded-lg text-sm bg-white border border-warm-gray-dark/50 disabled:opacity-40">→</button>
                            </div>
                        </div>`;

                    return `
                        <div class="space-y-3">
                            <div class="flex gap-2 overflow-x-auto -mx-1 px-1 pb-1">
                                ${sortBtn('latest',     '📅 Últimos')}
                                ${sortBtn('price_desc', '💰 Precio ↓')}
                                ${sortBtn('price_asc',  '💰 Precio ↑')}
                                ${sortBtn('contacts',   '👥 Más contactos')}
                            </div>
                            <div class="space-y-2">${cards}</div>
                            ${pager}
                        </div>`;
                }

                // --------- Modal Material (apilado — z-40) ---------
                let _matEsc = null;
                function openMaterialModal(material) {
                    closeMaterialModal();
                    s._matModal = { material, detail: null, contacts: [], contactSort: 'best', loading: true };
                    renderMaterialModal();
                    _matEsc = (e) => { if (e.key === 'Escape') closeMaterialModal(); };
                    document.addEventListener('keydown', _matEsc);
                    (async () => {
                        try {
                            const [det, cts] = await Promise.all([
                                loadMaterialDetail(material),
                                loadMaterialContacts(material, 'best'),
                            ]);
                            if (!s._matModal || s._matModal.material !== material) return;
                            s._matModal.detail = det;
                            s._matModal.contacts = cts.contacts || [];
                            s._matModal.loading = false;
                            renderMaterialModal();
                        } catch (e) {
                            s._matModal && (s._matModal.error = e.message || String(e), s._matModal.loading = false);
                            renderMaterialModal();
                        }
                    })();
                }
                function closeMaterialModal() {
                    s._matModal = null;
                    document.getElementById('peony-mat-modal')?.remove();
                    if (_matEsc) { document.removeEventListener('keydown', _matEsc); _matEsc = null; }
                }

                                    </svg>
                                </button>
                                <button id="peony-mat-close" class="w-9 h-9 rounded-full bg-warm-gray hover:bg-warm-gray-dark/60 flex items-center justify-center">✕</button>
                            </div>
                            ${m.loading ? `<div class="p-8">${loadingBox()}</div>` : m.error ? `<div class="p-4">${errorBox(m.error)}</div>` : `
                                <div class="p-4 space-y-4 overflow-y-auto">
                                    <!-- Stats -->
                                    <div class="grid grid-cols-3 gap-2">
                                        <div class="bg-warm-gray/40 rounded-xl p-3 text-center">

                                            <div class="font-mono font-bold text-red-800 text-lg">${st.min_price != null ? st.min_price.toFixed(2) : '—'}</div>
                                            <div class="text-[10px] text-red-700">${st.avg_price != null ? 'prom ' + st.avg_price.toFixed(2) : ''}</div>

                    modal.querySelector('#peony-mat-close')?.addEventListener('click', closeMaterialModal);
                    modal.querySelector('#peony-mat-calc-top')?.addEventListener('click', () => {
                        const latest = m.detail?.timeline?.[0];

                    });
                    modal.querySelectorAll('[data-csort]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const sort = btn.dataset.csort;
                            if (m.contactSort === sort) return;
                            m.contactSort = sort;
                            m.loading = true;
                            renderMaterialModal();
                            const r = await loadMaterialContacts(m.material, sort);
                            m.contacts = r.contacts || [];
                            m.loading = false;
                            renderMaterialModal();
                        });
                    });
                    modal.querySelectorAll('[data-contact]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const phone = btn.dataset.contact;
                            const c = m.contacts.find(x => x.phone === phone);
                            if (!c) return;
                            const latestRow = m.detail?.timeline?.[0];
                            const materialCtx = {
                                material: m.material,
                                price_raw: c.price_raw,
                                price_num: c.price_num,
                                file_date: c.latest_date,
                            };
                            // Reusa el modal de cliente del Listado (z-50, queda encima)
                            if (window.valkamsync?.openClientModal) {
                                window.valkamsync.openClientModal(c, { materialContext: materialCtx });
                            } else {
                                alert('Modal de cliente no disponible. Recarga la página.');
                            }
